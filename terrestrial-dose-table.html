<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Euro-Dose — European Terrestrial Dose Indicator</title>
<script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
:root{--bg:#0a0e1a;--panel:#111726;--card:#161e30;--border:#243049;--txt:#e6ebf5;--dim:#8b97b0;--blue:#3b82f6;--orange:#f97316;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--cyan:#5ad1c5;--font:'Inter',-apple-system,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:var(--font);font-size:13px;line-height:1.5;overflow:hidden;height:100vh}
.app{display:flex;flex-direction:column;height:100vh}
.topbar{height:46px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 14px;flex-shrink:0;z-index:100}
.topbar-brand{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;letter-spacing:-0.3px}
.topbar-controls{display:flex;align-items:center;gap:10px}
.search-box{display:flex;align-items:center;background:var(--bg);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.search-box input{background:transparent;border:none;color:var(--txt);padding:5px 10px;font-size:12px;width:140px;outline:none}
.search-box input::placeholder{color:var(--dim)}
.search-box button{background:transparent;border:none;color:var(--dim);padding:5px 10px;cursor:pointer;font-size:12px}
.search-box button:hover{color:var(--txt)}
.preset-select{background:var(--bg);border:1px solid var(--border);color:var(--txt);padding:5px 8px;border-radius:6px;font-size:12px;cursor:pointer;outline:none}
.main{display:flex;flex:1;overflow:hidden}
.map-col{flex:1;position:relative;min-width:0}
#map{width:100%;height:100%}
.float-tri{position:absolute;pointer-events:none;z-index:20;transform:translate(-50%,-50%)}
.float-tri svg{filter:drop-shadow(0 2px 8px rgba(0,0,0,0.5))}
.tri-tip{position:absolute;top:58%;left:50%;transform:translate(-50%,0);background:rgba(10,14,26,0.95);border:1px solid;border-radius:8px;padding:5px 10px;text-align:center;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,0.5);pointer-events:none}
.tri-tip .tot{font-size:13px;font-weight:700}
.tri-tip .tier{display:inline-block;font-size:9px;font-weight:700;text-transform:uppercase;padding:1px 5px;border-radius:3px;color:white;margin-top:2px}
.geol-toggle{position:absolute;top:10px;left:10px;z-index:30;background:rgba(17,23,38,0.95);backdrop-filter:blur(10px);border:1px solid var(--border);border-radius:8px;padding:6px 10px;display:flex;align-items:center;gap:8px;font-size:11px;color:var(--txt);cursor:pointer;user-select:none;transition:all 0.2s}
.geol-toggle:hover{background:rgba(22,30,48,0.95);border-color:var(--cyan)}
.geol-toggle .dot{width:8px;height:8px;border-radius:50%;background:var(--dim);transition:background 0.2s}
.geol-toggle.active .dot{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.geol-toggle .label-text{font-size:10px;color:var(--dim)}
.right-col{width:460px;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.right-tabs{display:flex;border-bottom:1px solid var(--border);background:var(--bg)}
.right-tabs button{flex:1;padding:9px 0;background:transparent;border:none;color:var(--dim);font-size:10px;font-weight:600;letter-spacing:0.3px;cursor:pointer;text-transform:uppercase}
.right-tabs button.active{color:var(--txt);border-bottom:2px solid var(--cyan);background:var(--panel)}
.right-content{flex:1;overflow-y:auto;padding:14px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.sec-title{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--dim);margin:14px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.sec-title:first-child{margin-top:0}
.risk-badge{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:6px;border:1px solid;margin-bottom:12px}
.risk-tier{font-size:10px;font-weight:700;text-transform:uppercase;padding:2px 7px;border-radius:3px;color:white}
.risk-tot{font-size:20px;font-weight:700;letter-spacing:-0.5px}
.risk-vs{font-size:10px;opacity:0.7;margin-left:auto}
.dose-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.dose-label{width:45px;font-size:9px;color:var(--dim);text-transform:uppercase}
.dose-track{flex:1;height:5px;background:var(--bg);border-radius:3px;overflow:hidden}
.dose-fill{height:100%;border-radius:3px;transition:width 0.4s}
.dose-val{width:40px;text-align:right;font-size:10px;font-weight:600;font-variant-numeric:tabular-nums}
.comp-row{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.comp-label{width:80px;font-size:9px;color:var(--dim)}
.comp-track{flex:1;height:4px;background:var(--bg);border-radius:2px;overflow:hidden}
.comp-fill{height:100%;border-radius:2px}
.comp-val{width:35px;text-align:right;font-size:9px;font-weight:600}
.why-item{display:flex;align-items:flex-start;gap:7px;font-size:11px;line-height:1.4;color:var(--dim);margin-bottom:5px}
.why-bullet{width:5px;height:5px;border-radius:50%;margin-top:5px;flex-shrink:0}
.idx-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
.idx-row{display:flex;justify-content:space-between;padding:3px 0;font-size:10px;border-bottom:1px solid var(--border)}
.idx-row.warn{color:var(--red)}
.idx-label{color:var(--dim);font-size:9px}
.idx-val{font-weight:600;font-size:10px}
.idx-val.warn{color:var(--red)}
.conf-track{height:4px;background:var(--bg);border-radius:2px;overflow:hidden;margin-bottom:3px}
.conf-fill{height:100%;border-radius:2px;transition:width 0.5s}
.conf-labels{display:flex;justify-content:space-between;font-size:8px;color:var(--dim)}
.tri-wrap{text-align:center;padding:12px 0}
.raw-table{width:100%;border-collapse:collapse;font-size:9px}
.raw-table th{background:var(--card);padding:4px 5px;text-align:left;font-weight:600;color:var(--dim);border-bottom:1px solid var(--border);font-size:8px;text-transform:uppercase;letter-spacing:0.3px;position:sticky;top:0;z-index:5}
.raw-table td{padding:3px 5px;border-bottom:1px solid rgba(36,48,73,0.3);vertical-align:top}
.raw-table .group{background:var(--card);color:var(--dim);font-size:8px;font-weight:600;letter-spacing:0.5px;padding:4px 5px}
.raw-table .na{color:var(--dim);opacity:0.4}
.agent-step{background:var(--card);border:1px solid var(--border);border-radius:6px;padding:10px;margin-bottom:8px;font-size:10px;line-height:1.6}
.agent-step b{color:var(--blue)}
.agent-step .arrow{color:var(--amber);margin:0 3px}
.agent-step code{background:var(--bg);padding:1px 4px;border-radius:3px;font-size:9px;color:var(--green)}
.step-label{display:inline-block;font-size:8px;font-weight:700;text-transform:uppercase;color:var(--cyan);margin-bottom:3px;border:1px solid var(--cyan);padding:1px 5px;border-radius:3px}
.map-loader{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);z-index:50;gap:10px;color:var(--dim);font-size:12px}
.spin{width:24px;height:24px;border:2px solid var(--border);border-top-color:var(--cyan);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:900px){.right-col{width:340px}}
@media(max-width:640px){.main{flex-direction:column}.right-col{width:100%;height:50vh;border-left:none;border-top:1px solid var(--border)}}
</style>
</head>

function nearestFault(lon,lat){let md=1/0,nf=null;for(const f of FL){const d=Math.hypot((lon-f.lon)*111*Math.cos(lat*0.01745),(lat-f.lat)*111);if(d<md){md=d;nf=f;}}return{name:nf?nf.name:"None",distM:Math.round(md*1000)};}

function GRP(ra,perm,df,ld){
 const pm={low:0.6,medium:1,high:1.5,unknown:1};
 return Math.round(ra*(pm[perm]||1)*(df<5000?1+(5000-Math.min(df,5000))/5000*0.5:1)*(1+(ld||0)*0.3));
}
function GTP(th){return Math.round(th*0.63);}
function rnDose(g){const r=g*0.4;return{ir:Math.round(r),d:r/300*10};}
function tnDose(g){const e=g*0.02,en=g>31?1+Math.pow((g-31)/31,0.8):1;return{d:e*40e-6*7000*en};}
function gmDose(ra,th,k){const D=0.462*ra+0.604*th+0.041*k;return{rate:D,d:D*8760*0.8*0.7*1e-6};}

function fingerprint(ra,th,k,perm,df,ld,conf,lbl){
 const g1=GRP(ra,perm,df,ld),g2=GTP(th),rn=rnDose(g1),tn=tnDose(g2),gm=gmDose(ra,th,k);
 const tot=rn.d+tn.d+gm.d,re=Math.round(1.43*ra+0.67*th+0.014*k),ig=ra/370+th/259+k/4810;
 let tier="GREEN",rs=[];
 if(tot>6.6||rn.ir>=300||gm.rate>=1000||re>=740){tier="RED";if(tot>6.6)rs.push(`Total ${tot.toFixed(2)} mSv/yr > 6.6`);if(rn.ir>=300)rs.push(`Indoor Rn ${rn.ir} Bq/m³ ≥ 300`);}
 else if(tot>2.2||rn.ir>=100||gm.rate>=59||re>=370){tier="AMBER";if(tot>2.2)rs.push(`Total ${tot.toFixed(2)} > UNSCEAR 2.2`);if(rn.ir>=100)rs.push(`Indoor Rn ${rn.ir} ≥ 100`);}
 else rs=["Within normal background."];
 return{activities:{A_Ra226:ra,A_Th232:th,A_K40:k},arms:{radon:rn.d,thoron:tn.d,gamma:gm.d},total:tot,risk:{tier,reasons:rs,rnBq:rn.ir,g_nGy:gm.rate,raeq:re},indices:{rnIndoor:rn.ir,raeq:re,ig},gamma_nGy_h:gm.rate,conf:conf,lbl};
}

  map.setLayoutProperty("gl-bg","visibility","visible");map.setLayoutProperty("gl-cg","visibility","visible");
  b.classList.add("active");b.innerHTML='<span class="dot"></span> Geology: ON <span class="label-text">(BGS 50k · Swisstopo GA25)</span>';
 }else{
  map.setLayoutProperty("gl-bg","visibility","none");map.setLayoutProperty("gl-cg","visibility","none");
  b.classList.remove("active");b.innerHTML='<span class="dot"></span> Geology: OFF <span class="label-text">(BGS 50k · Swisstopo GA25)</span>';
 }
}
function compute(lng,lat){
 const l=getLithologyAt(lng,lat);
 const a=toBqPerKg(l.eU_ppm,l.eTh_ppm,l.K_pct);
 const nf=nearestFault(lng,lat);
 const fp=fingerprint(a.A_Ra226,a.A_Th232,a.A_K40,"medium",nf.distM,0,l.confidence,l.name);
 return{fp,raw:{lith:l,act:a,fault:nf,lng,lat}};
}
function float(){
 let el=document.getElementById("ft");
 if(!el){el=document.createElement("div");el.id="ft";el.className="float-tri";document.querySelector(".map-col").appendChild(el);}
 const d=compute(cur.lng,cur.lat),a=d.fp.arms,tt=d.fp.total,tc=T[d.fp.risk.tier];
 el.style.display=pin?"none":"block";
 const mx=Math.max(a.radon,a.thoron,a.gamma,0.5),sc=50/mx;
 const rY=-a.radon*sc,tX=-a.thoron*sc*0.87,tY=a.thoron*sc*0.5,gX=a.gamma*sc*0.87,gY=a.gamma*sc*0.5;
 const pth=`M 0 ${rY} L ${tX} ${tY} L ${gX} ${gY} Z`;
 el.innerHTML=`<svg width="140" height="140" viewBox="-70 -70 140 140" style="overflow:visible">
  <path d="${pth}" fill="${tc}20" stroke="none" style="filter:blur(6px)"/>
  <path d="${pth}" fill="none" stroke="${tc}" stroke-width="1.5"/>
  <line x1="0" y1="0" x2="0" y2="${rY}" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
  <line x1="0" y1="0" x2="${tX}" y2="${tY}" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>
  <line x1="0" y1="0" x2="${gX}" y2="${gY}" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
  <circle cx="0" cy="0" r="2.5" fill="${tc}"/>
  <text x="0" y="${rY-5}" text-anchor="middle" fill="#3b82f6" font-size="8" font-weight="bold">Rn</text>
  <text x="${tX-7}" y="${tY+9}" text-anchor="end" fill="#f97316" font-size="8" font-weight="bold">Tn</text>
  <text x="${gX+7}" y="${gY+9}" text-anchor="start" fill="#22c55e" font-size="8" font-weight="bold">γ</text>
 </svg>
 <div class="tri-tip" style="border-color:${tc}"><div class="tot" style="color:${tc}">${tt.toFixed(2)} mSv/yr</div><div class="tier" style="background:${tc}">${d.fp.risk.tier}</div></div>`;
}
function switchTab(t){tab=t;document.querySelectorAll(".right-tabs button").forEach(b=>b.classList.toggle("active",b.dataset.tab===t));render();}
function compBar(l,v,m,c){return`<div class="comp-row"><span class="comp-label">${l}</span><div class="comp-track"><div class="comp-fill" style="width:${Math.min(v/m*100,100)}%;background:${c}"></div></div><span class="comp-val">${v.toFixed(2)}</span></div>`;}
function tSVG(rn,tn,gm,tc){let mx=Math.max(rn,tn,gm,0.5),s=60/mx,rY=-rn*s,tX=-tn*s*0.87,tY=tn*s*0.5,gX=gm*s*0.87,gY=gm*s*0.5,p=`M 0 ${rY} L ${tX} ${tY} L ${gX} ${gY} Z`;return`<svg width="180" height="160" viewBox="-90 -80 180 160" style="overflow:visible"><path d="${p}" fill="${tc}15" style="filter:blur(8px)"/><path d="${p}" fill="none" stroke="${tc}" stroke-width="2"/><line x1="0" y1="0" x2="0" y2="${rY}" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/><line x1="0" y1="0" x2="${tX}" y2="${tY}" stroke="#f97316" stroke-width="3" stroke-linecap="round"/><line x1="0" y1="0" x2="${gX}" y2="${gY}" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/><circle cx="0" cy="0" r="3" fill="${tc}"/><text x="0" y="${rY-7}" text-anchor="middle" fill="#3b82f6" font-size="9" font-weight="bold">Rn</text><text x="${tX-9}" y="${tY+11}" text-anchor="end" fill="#f97316" font-size="9" font-weight="bold">Tn</text><text x="${gX+9}" y="${gY+11}" text-anchor="start" fill="#22c55e" font-size="9" font-weight="bold">γ</text></svg>`;}
function render(){
 const el=document.getElementById("rc");
 if(!pin){el.innerHTML='<div style="text-align:center;padding:40px;color:var(--dim)"><p>Click the map to pin a dose report</p><p style="font-size:11px;opacity:0.6;margin-top:6px">Hover for live triangle</p></div>';return;}
 const d=pin,fp=d.fp,a=fp.arms,tc=T[fp.risk.tier],mx=Math.max(a.radon,a.thoron,a.gamma);
 const ea=[{l:"Radon",v:a.radon,c:"#3b82f6",p:mx?100*a.radon/mx:0},{l:"Thoron",v:a.thoron,c:"#f97316",p:mx?100*a.thoron/mx:0},{l:"Gamma",v:a.gamma,c:"#22c55e",p:mx?100*a.gamma/mx:0}].sort((x,y)=>y.v-x.v);
 if(tab==="dose"){
  el.innerHTML=`
   <div class="risk-badge" style="border-color:${tc}40;background:${tc}10"><span class="risk-tier" style="background:${tc}">${fp.risk.tier}</span><span class="risk-tot" style="color:${tc}">${fp.total.toFixed(2)} mSv/yr</span><span class="risk-vs">${fp.total>2.2?(fp.total/2.2).toFixed(1)+"× UNSCEAR":"≤ UNSCEAR"}</span></div>
   <div class="tri-wrap">${tSVG(a.radon,a.thoron,a.gamma,tc)}</div>
   <div class="tri-labels" style="display:flex;justify-content:center;gap:14px;font-size:9px;margin-bottom:8px"><span style="color:#3b82f6">● Radon ${a.radon.toFixed(2)}</span><span style="color:#f97316">● Thoron ${a.thoron.toFixed(2)}</span><span style="color:#22c55e">● Gamma ${a.gamma.toFixed(2)}</span></div>
   <div class="sec-title">Dose Breakdown</div>${ea.map(e=>`<div class="dose-row"><span class="dose-label">${e.l}</span><div class="dose-track"><div class="dose-fill" style="width:${e.p}%;background:${e.c}"></div></div><span class="dose-val" style="color:${e.c}">${e.v.toFixed(2)}</span></div>`).join("")}
   <div class="sec-title">Why?</div><div class="why-list">${fp.risk.reasons.map(r=>`<div class="why-item"><span class="why-bullet" style="background:${tc}"></span><span>${r}</span></div>`).join("")}<div class="why-item"><span class="why-bullet" style="background:var(--cyan)"></span><span>Geology: ${fp.lbl}. Ra-226=${fp.activities.A_Ra226}, Th-232=${fp.activities.A_Th232}, K-40=${fp.activities.A_K40} Bq/kg.</span></div></div>
   <div class="sec-title">Comparison</div>${compBar("This location",fp.total,8,tc)}${compBar("UNSCEAR avg",2.2,8,"#64748b")}${compBar("EU BSS limit",6.6,8,"#64748b")}
   <div class="sec-title">Indices</div><div class="idx-grid">
    <div class="idx-row${fp.indices.rnIndoor>300?" warn":""}"><span class="idx-label">Indoor Rn</span><span class="idx-val${fp.indices.rnIndoor>300?" warn":""}">${fp.indices.rnIndoor} Bq/m³</span></div>
    <div class="idx-row${fp.indices.raeq>740?" warn":""}"><span class="idx-label">Ra-eq</span><span class="idx-val${fp.indices.raeq>740?" warn":""}">${fp.indices.raeq} Bq/kg</span></div>
    <div class="idx-row${fp.indices.ig>1?" warn":""}"><span class="idx-label">Iγ</span><span class="idx-val${fp.indices.ig>1?" warn":""}">${fp.indices.ig.toFixed(2)}</span></div>
    <div class="idx-row${fp.gamma_nGy_h>1000?" warn":""}"><span class="idx-label">Gamma</span><span class="idx-val${fp.gamma_nGy_h>1000?" warn":""}">${Math.round(fp.gamma_nGy_h)} nGy/h</span></div></div>
   <div class="sec-title">Confidence</div><div class="conf-track"><div class="conf-fill" style="width:${fp.conf}%;background:${fp.conf>=60?"#22c55e":fp.conf>=30?"#f59e0b":"#ef4444"}"></div></div><div class="conf-labels"><span>Low</span><span style="color:${fp.conf>=60?"#22c55e":fp.conf>=30?"#f59e0b":"#ef4444"}">${fp.conf}%</span><span>High</span></div>
   <p style="font-size:9px;color:var(--dim);margin-top:4px">Source: ${d.raw.lith.source} · Scale: ${d.raw.lith.scale}</p>
   <div class="sec-title">Standards</div>
   <div style="display:flex;gap:12px;font-size:9px;color:var(--dim)"><span style="color:#22c55e">● Green ≤ 2.2</span><span style="color:#f59e0b">● Amber 2.2–6.6</span><span style="color:#ef4444">● Red > 6.6</span></div>`;
 }else if(tab==="raw"){
  const l=d.raw.lith;const a=d.raw.act;const nf=d.raw.fault;
  const na='<span class="na">—</span>';
  el.innerHTML=`<div style="font-size:10px;color:var(--dim);margin-bottom:8px">Raw values from open European datasets at (${d.raw.lng.toFixed(4)}°, ${d.raw.lat.toFixed(4)}°)</div>
   <table class="raw-table"><thead><tr><th>#</th><th>Parameter</th><th>Value</th><th>Source</th></tr></thead><tbody>
   <tr><td colspan="4" class="group">LOCATION</td></tr>
   <tr><td>1</td><td>lat</td><td>${d.raw.lat.toFixed(4)}°</td><td>Cursor</td></tr>
   <tr><td>2</td><td>lon</td><td>${d.raw.lng.toFixed(4)}°</td><td>Cursor</td></tr>
   <tr><td>3</td><td>map_scale</td><td>${l.scale}</td><td>${l.source}</td></tr>
   <tr><td colspan="4" class="group">GEOLOGY (raw mapped — NOT activities)</td></tr>
   <tr><td>4</td><td>lithology_class</td><td>${l.lith_class} (${ACT[l.lith_class]?ACT[l.lith_class].l:"?"})</td><td>${l.source}</td></tr>
   <tr><td>5</td><td>province_name</td><td>${l.name}</td><td>National survey</td></tr>
   <tr><td>6</td><td>eU_ppm (from natl survey)</td><td>${l.eU_ppm} ppm</td><td>${l.source}</td></tr>
   <tr><td>7</td><td>eTh_ppm (from natl survey)</td><td>${l.eTh_ppm} ppm</td><td>${l.source}</td></tr>
   <tr><td>8</td><td>K_pct (from natl survey)</td><td>${l.K_pct}%</td><td>${l.source}</td></tr>
   <tr><td colspan="4" class="group">DERIVED ACTIVITIES (agent converts eU/eTh/K → Bq/kg)</td></tr>
   <tr><td>9</td><td>A_Ra-226</td><td>= ${l.eU_ppm} × 12.35 = <b>${a.A_Ra226} Bq/kg</b></td><td>IAEA SRS-49</td></tr>
   <tr><td>10</td><td>A_Th-232</td><td>= ${l.eTh_ppm} × 4.06 = <b>${a.A_Th232} Bq/kg</b></td><td>IAEA SRS-49</td></tr>
   <tr><td>11</td><td>A_K-40</td><td>= ${l.K_pct} × 313 = <b>${a.A_K40} Bq/kg</b></td><td>IAEA SRS-49</td></tr>
   <tr><td colspan="4" class="group">STRUCTURAL</td></tr>
   <tr><td>12</td><td>nearest_fault</td><td>${nf.name}</td><td>GEM + national</td></tr>
   <tr><td>13</td><td>dist_fault_m</td><td>${nf.distM.toLocaleString()} m</td><td>Computed</td></tr>
   <tr><td colspan="4" class="group">JRC / MEASURED</td></tr>
   <tr><td>14</td><td>JRC gamma (nGy/h)</td><td>${na}</td><td>JRC EANR (not cached)</td></tr>
   <tr><td>15</td><td>JRC indoor Rn</td><td>${na}</td><td>JRC EANR</td></tr>
   </tbody></table>`;
 }else if(tab==="steps"){
  const l=d.raw.lith;const a=d.raw.act;const nf=d.raw.fault;const fp=pinned.fp;
  const perm="medium";const df=nf.distM;const ld=0;
  el.innerHTML=`
   <div class="agent-step"><span class="step-label">A: Lookup activities</span><br><b>Read</b> <code>lithology_class</code>=${l.lith_class} (${l.name}) <span class="arrow">→</span> <b>eU</b>=${l.eU_ppm} ppm, <b>eTh</b>=${l.eTh_ppm} ppm, <b>K</b>=${l.K_pct}%<br><b>Convert:</b> eU × 12.35 = <b>${a.A_Ra226} Bq/kg Ra-226</b> · eTh × 4.06 = <b>${a.A_Th232} Bq/kg Th-232</b> · K% × 313 = <b>${a.A_K40} Bq/kg K-40</b><br><span style="color:var(--dim);font-size:9px">Source: ${l.source} (${l.scale}). JRC measured values not available at this point.</span></div>
   <div class="agent-step"><span class="step-label">B: Permeability</span><br>${a.A_Ra226} Bq/kg × perm=${perm} × fault=${df<5000?">1":1.0} → <b>GRP=${GRP(a.A_Ra226,perm,df,ld)}</b><br><span style="color:var(--dim)">No real SoilGrids data cached — using medium permeability default. Install soilgrids API for real values.</span></div>
   <div class="agent-step"><span class="step-label">C: Thoron potential</span><br>${a.A_Th232} × 0.630 = <b>GTP=${GTP(a.A_Th232)}</b></div>
   <div class="agent-step"><span class="step-label">D: Radon dose</span><br>GRP=${GRP(a.A_Ra226,perm,df,ld)} → indoor Rn = ${GRP(a.A_Ra226,perm,df,ld)} × 0.4 = <b>${Math.round(GRP(a.A_Ra226,perm,df,ld)*0.4)} Bq/m³</b> → dose = ${Math.round(GRP(a.A_Ra226,perm,df,ld)*0.4)} / 300 × 10 = <b style="color:#3b82f6">${fp.arms.radon.toFixed(2)} mSv/yr</b></div>
   <div class="agent-step"><span class="step-label">E: Thoron dose</span><br>GTP=${GTP(a.A_Th232)} → EEC = ${GTP(a.A_Th232)} × 0.02 = <b>${(GTP(a.A_Th232)*0.02).toFixed(1)} Bq/m³</b> → dose = ${fp.arms.thoron.toFixed(2)} × 40e-6 × 7000 × enhancement = <b style="color:#f97316">${fp.arms.thoron.toFixed(2)} mSv/yr</b></div>
   <div class="agent-step"><span class="step-label">F: Gamma dose</span><br>D = 0.462×${a.A_Ra226} + 0.604×${a.A_Th232} + 0.041×${a.A_K40} = <b>${Math.round(fp.gamma_nGy_h)} nGy/h</b> → E = D × 8760 × 0.8 × 0.7 × 1e-6 = <b style="color:#22c55e">${fp.arms.gamma.toFixed(2)} mSv/yr</b></div>
   <div class="agent-step"><span class="step-label">G: Total & Classification</span><br>Sum: ${fp.arms.radon.toFixed(2)} + ${fp.arms.thoron.toFixed(2)} + ${fp.arms.gamma.toFixed(2)} = <b style="color:${T[fp.risk.tier]}">${fp.total.toFixed(2)} mSv/yr → ${fp.risk.tier}</b><br><span style="font-size:9px;color:var(--dim)">Ra-eq = ${fp.indices.raeq} Bq/kg, Iγ = ${fp.indices.ig.toFixed(2)}</span></div>
   <div class="agent-step"><span class="step-label">H: Confidence</span><br><b>${fp.conf}%</b> — ${fp.conf>=60?"Direct measurement (airborne gamma survey)":fp.conf>=55?"National survey data":"Modelled from geology"}<br><span style="font-size:9px;color:var(--dim)">Confidence improves with: JRC measurements, FOREGS sample data, SoilGrids permeability, S2 alteration indices.</span></div>`;
 }
}

async function doSearch(){const q=document.getElementById("si").value.trim();if(!q)return;try{const r=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=1`);const d=await r.json();if(d&&d[0]){const lat=parseFloat(d[0].lat),lon=parseFloat(d[0].lon);map.flyTo({center:[lon,lat],zoom:14});cur={lng:lon,lat};pin=compute(lon,lat);render();}}catch(e){}}
function handlePreset(v){if(!v)return;const[p,lo]=v.split(",");const lat=parseFloat(p),lon=parseFloat(lo);map.flyTo({center:[lon,lat],zoom:14});cur={lng:lon,lat};pin=compute(lon,lat);render();}

window.addEventListener("DOMContentLoaded",()=>{init();render();});
</script></body></html>
