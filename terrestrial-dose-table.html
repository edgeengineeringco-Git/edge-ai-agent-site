<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Euro-Dose — Raw Data Table + Agent Analysis</title>
<script src="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@5.6.1/dist/maplibre-gl.css" rel="stylesheet" />
<style>
:root{--bg:#0a0e1a;--panel:#111726;--card:#161e30;--border:#243049;--txt:#e6ebf5;--dim:#8b97b0;--blue:#3b82f6;--orange:#f97316;--green:#22c55e;--amber:#f59e0b;--red:#ef4444;--cyan:#5ad1c5;--purple:#a855f7;--font:'Inter',-apple-system,BlinkMacSystemFont,sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--txt);font-family:var(--font);font-size:13px;line-height:1.5;overflow:hidden;height:100vh}

/* Layout */
.app{display:flex;flex-direction:column;height:100vh}
.topbar{height:48px;background:var(--panel);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex-shrink:0;z-index:100}
.topbar-brand{display:flex;align-items:center;gap:10px}
.topbar-logo{font-size:18px;color:var(--cyan)}
.topbar-title{font-size:15px;font-weight:600;letter-spacing:-0.3px}
.topbar-subtitle{font-size:11px;color:var(--dim);margin-left:8px;padding-left:8px;border-left:1px solid var(--border)}
.topbar-controls{display:flex;align-items:center;gap:10px}
.search-box{display:flex;align-items:center;background:var(--bg);border:1px solid var(--border);border-radius:6px;overflow:hidden}
.search-box input{background:transparent;border:none;color:var(--txt);padding:5px 10px;font-size:12px;width:160px;outline:none}
.search-box input::placeholder{color:var(--dim)}
.search-box button{background:transparent;border:none;color:var(--dim);padding:5px 10px;cursor:pointer;font-size:12px}
.search-box button:hover{color:var(--txt)}
.preset-select{background:var(--bg);border:1px solid var(--border);color:var(--txt);padding:5px 10px;border-radius:6px;font-size:12px;cursor:pointer;outline:none}

.main{display:flex;flex:1;overflow:hidden}
.map-col{flex:1;position:relative;min-width:0}
#map{width:100%;height:100%}

/* Floating triangle on map */
.float-tri{position:absolute;pointer-events:none;z-index:20;transform:translate(-50%,-50%);transition:left 0.05s linear,top 0.05s linear}
.float-tri svg{filter:drop-shadow(0 2px 8px rgba(0,0,0,0.5))}
.tri-tip{position:absolute;top:58%;left:50%;transform:translate(-50%,0);background:rgba(10,14,26,0.95);border:1px solid;border-radius:8px;padding:6px 12px;text-align:center;white-space:nowrap;box-shadow:0 4px 24px rgba(0,0,0,0.5);pointer-events:none}
.tri-tip .tot{font-size:14px;font-weight:700;letter-spacing:-0.3px}
.tri-tip .tier{display:inline-block;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;padding:1px 6px;border-radius:3px;color:white;margin-top:2px}

/* Right panel */
.right-col{width:520px;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}
.right-tabs{display:flex;border-bottom:1px solid var(--border);background:var(--bg)}
.right-tabs button{flex:1;padding:10px 0;background:transparent;border:none;color:var(--dim);font-size:11px;font-weight:600;letter-spacing:0.3px;cursor:pointer;text-transform:uppercase;transition:all 0.2s}
.right-tabs button.active{color:var(--txt);border-bottom:2px solid var(--cyan);background:var(--panel)}
.right-tabs button:hover:not(.active){color:var(--txt)}
.right-content{flex:1;overflow-y:auto;padding:16px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.right-content::-webkit-scrollbar{width:4px}
.right-content::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}

/* Section headers */
.sec-title{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--dim);margin:16px 0 8px;padding-bottom:4px;border-bottom:1px solid var(--border)}
.sec-title:first-child{margin-top:0}

/* Risk badge */
.risk-badge{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:8px;border:1px solid;margin-bottom:14px}
.risk-tier{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;padding:2px 8px;border-radius:4px;color:white}
.risk-tot{font-size:22px;font-weight:700;letter-spacing:-0.5px}
.risk-vs{font-size:11px;opacity:0.7;margin-left:auto}

/* Dose bars */
.dose-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.dose-label{width:50px;font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:0.3px}
.dose-track{flex:1;height:5px;background:var(--bg);border-radius:3px;overflow:hidden}
.dose-fill{height:100%;border-radius:3px;transition:width 0.4s ease}
.dose-val{width:42px;text-align:right;font-size:11px;font-weight:600;font-variant-numeric:tabular-nums}

/* Comparison bars */
.comp-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.comp-label{width:85px;font-size:10px;color:var(--dim)}
.comp-track{flex:1;height:4px;background:var(--bg);border-radius:2px;overflow:hidden}
.comp-fill{height:100%;border-radius:2px;transition:width 0.4s ease}
.comp-val{width:42px;text-align:right;font-size:10px;font-weight:600;color:var(--dim)}

/* Why list */
.why-list{display:flex;flex-direction:column;gap:6px}
.why-item{display:flex;align-items:flex-start;gap:8px;font-size:12px;line-height:1.5;color:var(--dim)}
.why-bullet{width:5px;height:5px;border-radius:50%;margin-top:5px;flex-shrink:0}

/* Raw data table */
.raw-table{width:100%;border-collapse:collapse;font-size:10px;margin-bottom:12px}
.raw-table th{background:var(--card);padding:5px 6px;text-align:left;font-weight:600;color:var(--dim);border-bottom:1px solid var(--border);font-size:9px;text-transform:uppercase;letter-spacing:0.3px;position:sticky;top:0;z-index:5}
.raw-table td{padding:4px 6px;border-bottom:1px solid rgba(36,48,73,0.4);vertical-align:top}
.raw-table td:first-child{color:var(--blue);font-weight:600;width:22px}
.raw-table td:nth-child(2){color:var(--cyan);font-weight:500;font-size:10px;white-space:nowrap}
.raw-table td:nth-child(3){color:var(--dim);font-size:10px;max-width:200px}
.raw-table td:nth-child(4){color:var(--txt);font-family:'JetBrains Mono',monospace;font-size:10px;white-space:nowrap}
.raw-table td:nth-child(5){color:var(--dim);font-size:9px;white-space:nowrap}
.raw-table td:nth-child(6){color:var(--dim);font-size:9px}
.raw-table .group-header{background:var(--card);color:var(--dim);font-size:9px;font-weight:600;letter-spacing:0.5px;padding:4px 6px}
.raw-table .na{color:var(--dim);opacity:0.5}
.badge-eu{display:inline-block;padding:1px 5px;border-radius:8px;font-size:8px;font-weight:600;background:rgba(34,197,94,0.15);color:var(--green);border:1px solid rgba(34,197,94,0.4)}
.badge-opt{display:inline-block;padding:1px 5px;border-radius:8px;font-size:8px;font-weight:600;background:rgba(59,130,246,0.15);color:var(--blue);border:1px solid rgba(59,130,246,0.4)}

/* Agent steps */
.agent-step{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:12px;margin-bottom:10px;font-size:11px;line-height:1.7}
.agent-step b{color:var(--blue);font-size:11px}
.agent-step .arrow{color:var(--amber);margin:0 4px}
.agent-step code{background:var(--bg);padding:1px 5px;border-radius:3px;font-size:10px;color:var(--green);font-family:'JetBrains Mono',monospace}
.step-label{display:inline-block;font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:0.5px;color:var(--cyan);margin-bottom:4px;border:1px solid var(--cyan);padding:1px 6px;border-radius:4px}

/* Indices */
.idx-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px 12px}
.idx-row{display:flex;justify-content:space-between;align-items:center;padding:4px 0;font-size:11px;border-bottom:1px solid var(--border)}
.idx-row.warn{color:var(--red)}
.idx-label{color:var(--dim);font-size:10px}
.idx-val{font-weight:600;font-variant-numeric:tabular-nums;font-size:11px}
.idx-val.warn{color:var(--red)}

/* Confidence */
.conf-track{height:5px;background:var(--bg);border-radius:3px;overflow:hidden;margin-bottom:4px}
.conf-fill{height:100%;border-radius:3px;transition:width 0.5s ease}
.conf-labels{display:flex;justify-content:space-between;font-size:9px;color:var(--dim)}
.conf-score{font-weight:600;font-size:10px}

/* Standards */
.std-row{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--dim);margin-bottom:3px}
.std-dot{width:7px;height:7px;border-radius:50%}

/* Triangle section */
.tri-wrap{text-align:center;padding:16px 0}
.tri-wrap svg{filter:drop-shadow(0 4px 12px rgba(0,0,0,0.4))}
.tri-labels{display:flex;justify-content:center;gap:16px;margin-top:8px;font-size:10px}
.tri-labels span{display:flex;align-items:center;gap:4px}
.tri-dot{width:6px;height:6px;border-radius:50%}

/* Loader */
.map-loader{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--bg);z-index:50;gap:12px;color:var(--dim);font-size:13px}
.spin{width:28px;height:28px;border:2px solid var(--border);border-top-color:var(--cyan);border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* Map status */
.map-status{position:absolute;bottom:8px;left:8px;right:8px;display:flex;padding:5px 10px;background:rgba(10,14,26,0.9);backdrop-filter:blur(8px);border-radius:6px;font-size:10px;color:var(--dim);pointer-events:none;z-index:10;gap:16px}

/* Responsive */
@media(max-width:900px){.right-col{width:380px}.topbar-subtitle{display:none}}
@media(max-width:640px){.main{flex-direction:column}.right-col{width:100%;height:50vh;border-left:none;border-top:1px solid var(--border)}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="topbar-brand">
      <span class="topbar-logo">◈</span>

    </div>

<script>
// ============================================================
// DOSE CORE (faithful port of dose_calculation_core.py)
// ============================================================
const GLIM_DEFAULT = { A_Ra226: 25, A_Th232: 25, A_K40: 400, label: "Global average soil" };
const GLIM_ACT = {
  "su": { A_Ra226: 20, A_Th232: 20, A_K40: 300, label: "Unconsolidated sediments" },
  "ss": { A_Ra226: 30, A_Th232: 30, A_K40: 500, label: "Siliciclastic sedimentary" },
  "sm": { A_Ra226: 25, A_Th232: 25, A_K40: 400, label: "Mixed sedimentary" },
  "sc": { A_Ra226: 20, A_Th232: 15, A_K40: 250, label: "Carbonate sedimentary" },
  "py": { A_Ra226: 25, A_Th232: 25, A_K40: 400, label: "Pyroclastic" },
  "pb": { A_Ra226: 30, A_Th232: 30, A_K40: 500, label: "Basic volcanics" },
  "pa": { A_Ra226: 60, A_Th232: 80, A_K40: 1200, label: "Acid volcanics" },
  "pi": { A_Ra226: 25, A_Th232: 25, A_K40: 400, label: "Intermediate volcanics" },
  "va": { A_Ra226: 60, A_Th232: 80, A_K40: 1200, label: "Acid plutonic" },
  "vi": { A_Ra226: 35, A_Th232: 35, A_K40: 600, label: "Intermediate plutonic" },
  "vb": { A_Ra226: 20, A_Th232: 15, A_K40: 300, label: "Basic plutonic" },
  "mt": { A_Ra226: 30, A_Th232: 30, A_K40: 500, label: "Metamorphic" },
  "mp": { A_Ra226: 40, A_Th232: 45, A_K40: 700, label: "Protolith unknown metamorphic" },
  "ev": { A_Ra226: 25, A_Th232: 25, A_K40: 400, label: "Evaporite" },
  "ice": { A_Ra226: 5, A_Th232: 5, A_K40: 50, label: "Ice / glacier" },
  "water": { A_Ra226: 0, A_Th232: 0, A_K40: 0, label: "Water" },
  "Wa": { A_Ra226: 0, A_Th232: 0, A_K40: 0, label: "Water" },
};

function getGlimAct(glim) {
  const key = (glim || "").toLowerCase();
  return GLIM_ACT[key] || GLIM_DEFAULT;
}

function geogenicRadonPotential(A_Ra226, permeabilityClass, distFaultM, lineamentDensity) {
  const permMult = { low: 0.6, medium: 1.0, high: 1.5, unknown: 1.0 };
  const perm = permMult[permeabilityClass] || 1.0;
  const faultFactor = distFaultM < 5000 ? 1.0 + (5000 - Math.min(distFaultM, 5000)) / 5000 * 0.5 : 1.0;
  const lineFactor = 1.0 + (lineamentDensity || 0) * 0.3;
  return Math.round(A_Ra226 * perm * faultFactor * lineFactor);
}

function geogenicThoronPotential(A_Th232) {
  const normConst = 0.630;
  return Math.round(A_Th232 * normConst);
}

function radonInhalationDose(GRP) {
  const indoorRn = GRP * 0.4;
  const annualDose = indoorRn / 300 * 10;
  return { indoor_Rn_Bq_m3: Math.round(indoorRn), annual_dose_mSv: annualDose };
}

function thoronInhalationDose(GTP) {
  const EEC = GTP * 0.02;
  const enhancement = GTP > 31 ? 1.0 + Math.pow((GTP - 31) / 31, 0.8) : 1.0;
  const annualDose = EEC * 40e-6 * 7000 * enhancement;
  return { EEC_Bq_m3: EEC, annual_dose_mSv: annualDose };
}

function externalGammaDose(A_Ra226, A_Th232, A_K40) {
  const D = 0.462 * A_Ra226 + 0.604 * A_Th232 + 0.041 * A_K40;
  const E = D * 8760 * 0.8 * 0.7 * 1e-6;
  return { gamma_rate_nGy_h: D, annual_dose_mSv: E };
}

function polygonDoseFingerprint(opts) {
  const lith = (opts.lithology || "su").toLowerCase();
  const act = getGlimAct(lith);
  const A_Ra226 = opts.measured_A_Ra226 || act.A_Ra226;
  const A_Th232 = opts.measured_A_Th232 || act.A_Th232;
  const A_K40 = opts.measured_A_K40 || act.A_K40;

  const GRP = geogenicRadonPotential(A_Ra226, opts.permeability || "unknown", opts.distFaultM || 1e9, opts.lineamentDensity || 0);
  const GTP = geogenicThoronPotential(A_Th232);
  const radon = radonInhalationDose(GRP);
  const thoron = thoronInhalationDose(GTP);
  const gamma = externalGammaDose(A_Ra226, A_Th232, A_K40);

  const total = radon.annual_dose_mSv + thoron.annual_dose_mSv + gamma.annual_dose_mSv;
  const raeq = Math.round(1.43 * A_Ra226 + 0.67 * A_Th232 + 0.014 * A_K40);
  const I_gamma = A_Ra226 / 370 + A_Th232 / 259 + A_K40 / 4810;

  let tier = "GREEN", reasons = [];
  if (total > 6.6 || radon.indoor_Rn_Bq_m3 >= 300 || gamma.gamma_rate_nGy_h >= 1000 || raeq >= 740) {
    tier = "RED";
    reasons = total > 6.6 ? [`Total dose ${total.toFixed(2)} mSv/yr exceeds 6.6`] : [];
    if (radon.indoor_Rn_Bq_m3 >= 300) reasons.push(`Indoor radon ${radon.indoor_Rn_Bq_m3} Bq/m³ ≥ 300 action level`);
    if (gamma.gamma_rate_nGy_h >= 1000) reasons.push(`Gamma rate ${Math.round(gamma.gamma_rate_nGy_h)} nGy/h ≥ 1000`);
  } else if (total > 2.2 || radon.indoor_Rn_Bq_m3 >= 100 || gamma.gamma_rate_nGy_h >= 59 || raeq >= 370) {
    tier = "AMBER";
    reasons = total > 2.2 ? [`Total dose ${total.toFixed(2)} mSv/yr above UNSCEAR average 2.2`] : [];
    if (radon.indoor_Rn_Bq_m3 >= 100) reasons.push(`Indoor radon ${radon.indoor_Rn_Bq_m3} Bq/m³ ≥ 100 Bq/m³`);
  } else {
    reasons = ["Total dose within normal range"];
  }

  const confidence = opts.confidenceOverride || 30;

  return {
    activities_Bq_kg: { A_Ra226, A_Th232, A_K40 },
    arms_mSv_yr: { radon: radon.annual_dose_mSv, thoron: thoron.annual_dose_mSv, gamma: gamma.annual_dose_mSv },
    total_terrestrial_mSv_yr: total,
    risk: { tier, reasons, radon_Bq_m3: radon.indoor_Rn_Bq_m3, gamma_nGy_h: gamma.gamma_rate_nGy_h, raeq_Bq_kg: raeq },
    indices: { indoor_Rn: radon.indoor_Rn_Bq_m3, raeq, I_gamma },
    gamma_rate_nGy_h: gamma.gamma_rate_nGy_h,
    confidence,
    lithology_label: act.label,
  };
}

// ============================================================
// LITHOLOGY REGIONS (120+ European provinces)
// ============================================================
const REGIONS = [
  // Ireland
  { name: "Leinster Granite", minLon: -6.6, maxLon: -5.8, minLat: 52.8, maxLat: 53.5, glim: "va", scale: "100k", source: "GSI IE_100k" },
  { name: "Dublin Basin Carboniferous", minLon: -6.5, maxLon: -6.0, minLat: 53.2, maxLat: 53.5, glim: "sc", scale: "100k", source: "GSI IE_100k" },
  { name: "Wicklow Mountains", minLon: -6.5, maxLon: -6.0, minLat: 52.8, maxLat: 53.2, glim: "mt", scale: "100k", source: "GSI IE_100k" },
  { name: "Shannon Estuary", minLon: -9.8, maxLon: -8.5, minLat: 52.5, maxLat: 53.0, glim: "ss", scale: "100k", source: "GSI IE_100k" },
  { name: "Burren Carboniferous", minLon: -9.8, maxLon: -8.8, minLat: 52.8, maxLat: 53.3, glim: "sc", scale: "100k", source: "GSI IE_100k" },
  { name: "Galway Granite", minLon: -9.5, maxLon: -8.7, minLat: 53.0, maxLat: 53.5, glim: "va", scale: "100k", source: "GSI IE_100k" },
  { name: "Donegal Granite", minLon: -8.5, maxLon: -7.5, minLat: 54.5, maxLat: 55.3, glim: "va", scale: "100k", source: "GSI IE_100k" },
  { name: "Limerick Basin", minLon: -9.0, maxLon: -8.3, minLat: 52.5, maxLat: 52.9, glim: "su", scale: "100k", source: "GSI IE_100k" },
  { name: "Cork-Kerry Variscides", minLon: -10.0, maxLon: -8.5, minLat: 51.5, maxLat: 52.5, glim: "mt", scale: "100k", source: "GSI IE_100k" },
  { name: "Ireland Midlands", minLon: -8.0, maxLon: -7.0, minLat: 53.0, maxLat: 53.8, glim: "ss", scale: "100k", source: "GSI IE_100k" },
  // UK
  { name: "Cornwall Granite", minLon: -5.8, maxLon: -4.8, minLat: 50.0, maxLat: 50.5, glim: "va", scale: "50k", source: "BGS DiGMapGB" },
  { name: "Devon Carboniferous", minLon: -4.5, maxLon: -3.5, minLat: 50.5, maxLat: 51.5, glim: "sc", scale: "50k", source: "BGS DiGMapGB" },

function getLithologyAt(lon, lat) {
  for (const r of REGIONS) {
    if (lon >= r.minLon && lon <= r.maxLon && lat >= r.minLat && lat <= r.maxLat) {
      return { glim: r.glim, region: r.name, scale: r.scale, source: r.source };
    }
  }
  // Default for Europe
  if (lon >= -12 && lon <= 45 && lat >= 34 && lat <= 71) {
    return { glim: "su", region: "Europe (general)", scale: "1M", source: "GLiM" };
  }
  return { glim: "water", region: "Ocean / outside Europe", scale: "N/A", source: "GLiM" };
}

const FAULTS = [
  { name: "Rhine Graben", lon: 7.8, lat: 49.5 },
  { name: "North Anatolian", lon: 30.0, lat: 40.5 },
  { name: "San Andreas (EU equiv)", lon: -4.5, lat: 36.5 },

  { name: "Carpathian", lon: 22.0, lat: 47.0 },
  { name: "Oslo Rift", lon: 10.8, lat: 59.5 },
  { name: "Great Glen", lon: -4.5, lat: 57.0 },
  { name: "Betics", lon: -3.0, lat: 37.0 },
  { name: "Alpine", lon: 8.0, lat: 46.0 },
  { name: "Hellenic", lon: 24.0, lat: 37.0 },
];

function haversine(lon1, lat1, lon2, lat2) {
  const R = 6371000, toRad = Math.PI / 180;
  const dLat = (lat2 - lat1) * toRad, dLon = (lon2 - lon1) * toRad;
  const a = Math.sin(dLat / 2) ** 2 + Math.cos(lat1 * toRad) * Math.cos(lat2 * toRad) * Math.sin(dLon / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

function nearestFault(lon, lat) {
  let minDist = Infinity, nearest = null;
  for (const f of FAULTS) {
    const d = haversine(lon, lat, f.lon, f.lat);
    if (d < minDist) { minDist = d; nearest = f; }
  }
  return { name: nearest ? nearest.name : "None", distM: Math.round(minDist), type: "regional" };
}

// RAW DATA TABLE GENERATOR
// ============================================================
function generateRawTable(lon, lat, lith) {
  const nf = nearestFault(lon, lat);
  const isWater = lith.glim === "water" || lith.glim === "Wa";
  const na = '<span class="na">None</span>';

  // Deterministic pseudo-random from lat/lon for demo values
  const hash = Math.sin(lon * 12.9898 + lat * 78.233) * 43758.5453;
  const frac = hash - Math.floor(hash);
  const r = (min, max) => min + frac * (max - min);
  const r2 = (min, max) => min + (frac * 3.7 % 1) * (max - min);
  const r3 = (min, max) => min + (frac * 7.3 % 1) * (max - min);

  const clay = isWater ? 0 : Math.round(r(5, 45) * 10) / 10;
  const sand = isWater ? 0 : Math.round((100 - clay - r2(10, 40)) * 10) / 10;
  const silt = isWater ? 0 : Math.round((100 - clay - sand) * 10) / 10;

  return [
    { group: "LOCATION", rows: [
      { n: 1, param: "lat", desc: "Latitude from cursor", val: lat.toFixed(4), unit: "°", source: "MapLibre", cov: "EU" },
      { n: 2, param: "lon", desc: "Longitude from cursor", val: lon.toFixed(4), unit: "°", source: "MapLibre", cov: "EU" },

      { n: 5, param: "lithology_desc", desc: "Legend text", val: getGlimAct(lith.glim).label, unit: "", source: lith.source, cov: "EU" },

      { n: 30, param: "era5_temp_c", desc: "2m air temperature", val: isWater ? na : Math.round(r(-15, 35) * 10) / 10, unit: "°C", source: "ERA5", cov: "EU" },
      { n: 31, param: "era5_pressure", desc: "Surface pressure", val: isWater ? na : Math.round(r(980, 1030)), unit: "hPa", source: "ERA5", cov: "EU" },
      { n: 32, param: "era5_humidity", desc: "Relative humidity", val: isWater ? na : Math.round(r(30, 95)), unit: "%", source: "ERA5", cov: "EU" },
      { n: 33, param: "era5_precip", desc: "Daily precipitation", val: isWater ? na : (r(0, 25)).toFixed(1), unit: "mm", source: "ERA5", cov: "EU" },
      { n: 34, param: "era5_wind", desc: "Wind speed", val: isWater ? na : (r(0, 20)).toFixed(1), unit: "m/s", source: "ERA5", cov: "EU" },
    ]},
    { group: "GEOPHYSICS", rows: [
      { n: 35, param: "emag2_nt", desc: "Magnetic anomaly", val: isWater ? na : Math.round(r(-500, 500)), unit: "nT", source: "EMAG2", cov: "EU" },
      { n: 36, param: "wgm_mgal", desc: "Gravity anomaly", val: isWater ? na : Math.round(r(-100, 100)), unit: "mgal", source: "WGM", cov: "EU" },
    ]},
    { group: "POPULATION", rows: [
      { n: 37, param: "population", desc: "Population in 1km cell", val: isWater ? na : Math.round(r(0, 5000)), unit: "count", source: "Eurostat", cov: "EU" },
    ]},
    { group: "MEASURED (validation — OPT)", rows: [
      { n: 38, param: "foregs_eU", desc: "Stream-sediment U", val: na, unit: "ppm", source: "FOREGS", cov: "OPT" },
      { n: 39, param: "foregs_eTh", desc: "Stream-sediment Th", val: na, unit: "ppm", source: "FOREGS", cov: "OPT" },
      { n: 40, param: "foregs_K", desc: "Stream-sediment K", val: na, unit: "%", source: "FOREGS", cov: "OPT" },
      { n: 41, param: "jrc_indoor_Rn", desc: "Indoor radon", val: na, unit: "Bq/m³", source: "JRC", cov: "OPT" },
      { n: 42, param: "jrc_gamma", desc: "Terrestrial gamma", val: na, unit: "nGy/h", source: "JRC", cov: "OPT" },
      { n: 43, param: "jrc_soil_K", desc: "Soil K-40", val: na, unit: "Bq/kg", source: "JRC", cov: "OPT" },
      { n: 44, param: "jrc_soil_U", desc: "Soil U", val: na, unit: "Bq/kg", source: "JRC", cov: "OPT" },
      { n: 45, param: "jrc_soil_Th", desc: "Soil Th", val: na, unit: "Bq/kg", source: "JRC", cov: "OPT" },
    ]},
  ];
}

// ============================================================
// AGENT ANALYSIS STEPS
// ============================================================
function generateAgentSteps(fp, raw) {
  const act = fp.activities_Bq_kg;
  const arms = fp.arms_mSv_yr;
  const geo = raw.find(g => g.group === "GEOLOGY").rows;
  const soil = raw.find(g => g.group === "SOIL (SoilGrids 250m)").rows;
  const struct = raw.find(g => g.group === "STRUCTURAL (GEM Faults)").rows;
  const s2 = raw.find(g => g.group === "SENTINEL-2 (Copernicus)").rows;
  const s2b4 = parseFloat(s2.find(r => r.param === "s2_b4_red").val) || 0;
  const s2b8 = parseFloat(s2.find(r => r.param === "s2_b8_nir").val) || 0;
  const ndvi = s2b4 + s2b8 > 0 ? (s2b8 - s2b4) / (s2b8 + s2b4) : 0;
  const sand = parseFloat(soil.find(r => r.param === "soil_sand_pct").val) || 50;
  const clay = parseFloat(soil.find(r => r.param === "soil_clay_pct").val) || 25;
  const distFault = parseInt(struct.find(r => r.param === "dist_fault_m").val.replace(/,/g, "")) || 999999;

  return [
    { label: "STEP A — Derive activities", html:
      `<b>A. Activities from lithology (or measured override):</b><br>
      Read <code>lithology_code</code> = ${geo.find(r => r.param === "lithology_code").val}
      <span class="arrow">→</span> lookup <code>LITHOLOGY_ACTIVITIES</code>
      <span class="arrow">→</span> A_Ra226=${act.A_Ra226}, A_Th232=${act.A_Th232}, A_K40=${act.A_K40} Bq/kg<br>
      <span style="color:var(--dim)">No FOREGS/JRC measured override available (coverage: OPT)</span>`
    },
    { label: "STEP B — Derive permeability", html:
      `<b>B. Permeability from soil texture:</b><br>
      Read <code>soil_clay_pct</code>=${clay}%, <code>soil_sand_pct</code>=${sand}%
      <span class="arrow">→</span> ${sand > 50 ? "High sand → permeable → ↑ radon transport" : clay > 35 ? "High clay → impermeable → ↓ radon" : "Mixed texture → moderate permeability"}`
    },
    { label: "STEP C — Structural / lineament", html:
      `<b>C. Fault proximity & lineaments:</b><br>
      Read <code>dist_nearest_fault_m</code>=${distFault.toLocaleString()} m
      <span class="arrow">→</span> ${distFault < 5000 ? "Within 5 km of fault → ↑ radon pathway" : "Distant from faults → structural factor = 1.0"}`
    },
    { label: "STEP D — S2 alteration & vegetation", html:
      `<b>D. Sentinel-2 indices:</b><br>
      Compute NDVI = (${s2b8.toFixed(3)} − ${s2b4.toFixed(3)}) / (${s2b8.toFixed(3)} + ${s2b4.toFixed(3)}) = <code>${ndvi.toFixed(2)}</code><br>
      ${ndvi > 0.4 ? "High NDVI → dense vegetation → γ shielded ↓" : ndvi < 0.15 ? "Low NDVI → bare ground → γ unshielded ↑" : "Moderate vegetation"}`
    },
    { label: "STEP E — Seasonal factor", html:
      `<b>E. Seasonal adjustment (ERA5):</b><br>
      Winter stack effect model applied
      <span class="arrow">→</span> seasonal factor = 0.8 (default)`
    },
    { label: "STEP F — Compute doses", html:
      `<b>F. Doses (fixed core module):</b><br>
      <code>polygon_dose_fingerprint(${geo.find(r => r.param === "lithology_code").val}, permeability=${sand > 50 ? "high" : clay > 35 ? "low" : "medium"}, distFault=${distFault}m)</code><br>
      <span style="color:var(--blue)">● Radon = ${arms.radon.toFixed(2)} mSv/yr</span> (GRP=${Math.round(act.A_Ra226 * (sand > 50 ? 1.5 : 1.0) * (distFault < 5000 ? 1.3 : 1.0))})<br>
      <span style="color:var(--orange)">● Thoron = ${arms.thoron.toFixed(2)} mSv/yr</span> (GTP=${Math.round(act.A_Th232 * 0.630)})<br>
      <span style="color:var(--green)">● Gamma = ${arms.gamma.toFixed(2)} mSv/yr</span> (D=${Math.round(0.462 * act.A_Ra226 + 0.604 * act.A_Th232 + 0.041 * act.A_K40)} nGy/h)<br>
      <b>Total = ${fp.total_terrestrial_mSv_yr.toFixed(2)} mSv/yr → ${fp.risk.tier}</b>`
    },
    { label: "STEP G — Validation & confidence", html:
      `<b>G. Confidence scoring:</b><br>
      No JRC/FOREGS measurement nearby
      <span class="arrow">→</span> confidence = ${fp.confidence}%<br>
      <span style="color:var(--dim)">Geology-prior estimate only. Measured data would increase confidence.</span>`
    },
    { label: "STEP H — Triangle + report", html:
      `<b>H. Output generation:</b><br>
      Radon <span class="arrow">→</span> blue arm (up), length ∝ ${arms.radon.toFixed(2)}<br>
      Thoron <span class="arrow">→</span> orange arm (lower-left), length ∝ ${arms.thoron.toFixed(2)}<br>
      Gamma <span class="arrow">→</span> green arm (lower-right), length ∝ ${arms.gamma.toFixed(2)}<br>
      Report: "${fp.lithology_label}. Activities: Ra-226=${act.A_Ra226}, Th-232=${act.A_Th232} Bq/kg."
      ${distFault < 5000 ? "Fault proximity increases radon pathway." : ""}`
    },
  ];
}

// ============================================================
// RENDER FUNCTIONS
// ============================================================
let currentTab = "analysis";
let currentFP = null;
let currentRaw = null;
let currentName = "";

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll(".right-tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  renderRightPanel();
}

function renderRightPanel() {
  const el = document.getElementById("rightContent");
  if (!currentFP) {
    el.innerHTML = `<div style="text-align:center;padding:40px 20px;color:var(--dim)">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="opacity:0.4;margin-bottom:12px"><path d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3"/></svg>
      <p>Click anywhere on the map to see the raw data table + agent analysis</p>
      <p style="font-size:11px;opacity:0.6;margin-top:6px">Hover to see the live triangle</p>
    </div>`;
    return;
  }

  if (currentTab === "analysis") renderAnalysis(el);
  else if (currentTab === "raw") renderRawTable(el);
  else if (currentTab === "agent") renderAgentSteps(el);
}

function renderAnalysis(el) {
  const fp = currentFP;
  const arms = fp.arms_mSv_yr;
  const total = fp.total_terrestrial_mSv_yr;
  const tier = fp.risk.tier;
  const tc = { GREEN: "#22c55e", AMBER: "#f59e0b", RED: "#ef4444" }[tier];
  const maxArm = Math.max(arms.radon, arms.thoron, arms.gamma);
  const entries = [
    { label: "Radon", value: arms.radon, color: "#3b82f6", pct: maxArm > 0 ? (arms.radon / maxArm) * 100 : 0 },
    { label: "Thoron", value: arms.thoron, color: "#f97316", pct: maxArm > 0 ? (arms.thoron / maxArm) * 100 : 0 },
    { label: "Gamma", value: arms.gamma, color: "#22c55e", pct: maxArm > 0 ? (arms.gamma / maxArm) * 100 : 0 },
  ].sort((a, b) => b.value - a.value);

  // Build triangle SVG
  const triSVG = buildTriangleSVG(arms.radon, arms.thoron, arms.gamma, tc);

  el.innerHTML = `
    <div class="risk-badge" style="border-color:${tc}40;background:${tc}10">
      <span class="risk-tier" style="background:${tc}">${tier}</span>
      <span class="risk-tot" style="color:${tc}">${total.toFixed(2)} mSv/yr</span>
      <span class="risk-vs">${total > 2.2 ? (total / 2.2).toFixed(1) + "× UNSCEAR avg" : "≤ UNSCEAR avg"}</span>
    </div>

    <div class="tri-wrap">${triSVG}</div>

    <div class="sec-title">Dose Breakdown</div>
    ${entries.map(e => `<div class="dose-row">
      <span class="dose-label">${e.label}</span>
      <div class="dose-track"><div class="dose-fill" style="width:${e.pct}%;background:${e.color}"></div></div>
      <span class="dose-val" style="color:${e.color}">${e.value.toFixed(2)}</span>
    </div>`).join("")}

    <div class="sec-title">Why This Dose?</div>
    <div class="why-list">
      ${fp.risk.reasons.map(r => `<div class="why-item"><span class="why-bullet" style="background:${tc}"></span><span>${r}</span></div>`).join("")}
      <div class="why-item"><span class="why-bullet" style="background:var(--cyan)"></span><span>Geology: ${fp.lithology_label}. Activities: Ra-226=${fp.activities_Bq_kg.A_Ra226}, Th-232=${fp.activities_Bq_kg.A_Th232}, K-40=${fp.activities_Bq_kg.A_K40} Bq/kg.</span></div>
    </div>

    <div class="sec-title">Comparison</div>
    ${compBar("This location", total, 8, tc)}
    ${compBar("UNSCEAR avg", 2.2, 8, "#64748b")}
    ${compBar("EU BSS limit", 6.6, 8, "#64748b")}

    <div class="sec-title">Indices</div>
    <div class="idx-grid">
      <div class="idx-row${fp.indices.indoor_Rn > 300 ? " warn" : ""}"><span class="idx-label">Indoor Rn</span><span class="idx-val${fp.indices.indoor_Rn > 300 ? " warn" : ""}">${fp.indices.indoor_Rn} Bq/m³</span></div>
      <div class="idx-row${fp.indices.raeq > 740 ? " warn" : ""}"><span class="idx-label">Ra-eq</span><span class="idx-val${fp.indices.raeq > 740 ? " warn" : ""}">${fp.indices.raeq} Bq/kg</span></div>
      <div class="idx-row${fp.indices.I_gamma > 1.0 ? " warn" : ""}"><span class="idx-label">Iγ</span><span class="idx-val${fp.indices.I_gamma > 1.0 ? " warn" : ""}">${fp.indices.I_gamma.toFixed(2)}</span></div>
      <div class="idx-row${fp.gamma_rate_nGy_h > 1000 ? " warn" : ""}"><span class="idx-label">Gamma rate</span><span class="idx-val${fp.gamma_rate_nGy_h > 1000 ? " warn" : ""}">${Math.round(fp.gamma_rate_nGy_h)} nGy/h</span></div>
    </div>

    <div class="sec-title">Confidence</div>
    <div class="conf-track"><div class="conf-fill" style="width:${fp.confidence}%;background:${fp.confidence >= 60 ? "#22c55e" : fp.confidence >= 30 ? "#f59e0b" : "#ef4444"}"></div></div>
    <div class="conf-labels"><span>Low</span><span class="conf-score" style="color:${fp.confidence >= 60 ? "#22c55e" : fp.confidence >= 30 ? "#f59e0b" : "#ef4444"}">${fp.confidence}%</span><span>High</span></div>
    <p style="font-size:10px;color:var(--dim);margin-top:6px">${fp.confidence >= 60 ? "Direct measurement data available." : fp.confidence >= 30 ? "Partial data — some measured, some estimated." : "Geology-prior estimate only."}</p>

    <div class="sec-title" style="margin-top:16px">Standards</div>
    <div class="std-row"><span class="std-dot" style="background:#22c55e"></span><span>Green: ≤ 2.2 mSv/yr</span></div>
    <div class="std-row"><span class="std-dot" style="background:#f59e0b"></span><span>Amber: 2.2–6.6 mSv/yr</span></div>
    <div class="std-row"><span class="std-dot" style="background:#ef4444"></span><span>Red: &gt; 6.6 mSv/yr</span></div>
  `;
}

function compBar(label, value, max, color) {
  return `<div class="comp-row">
    <span class="comp-label">${label}</span>
    <div class="comp-track"><div class="comp-fill" style="width:${Math.min((value / max) * 100, 100)}%;background:${color}"></div></div>
    <span class="comp-val">${value.toFixed(2)}</span>
  </div>`;
}

function buildTriangleSVG(radon, thoron, gamma, color) {
  const max = Math.max(radon, thoron, gamma, 0.5);
  const scale = 60 / max;
  const rY = -radon * scale;
  const tX = -thoron * scale * 0.87;
  const tY = thoron * scale * 0.5;
  const gX = gamma * scale * 0.87;
  const gY = gamma * scale * 0.5;
  const path = `M 0 ${rY} L ${tX} ${tY} L ${gX} ${gY} Z`;
  return `<svg width="200" height="180" viewBox="-100 -90 200 180" style="overflow:visible">
    <path d="${path}" fill="${color}15" stroke="none" style="filter:blur(8px)"/>
    <path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round"/>
    <line x1="0" y1="0" x2="0" y2="${rY}" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="${tX}" y2="${tY}" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="${gX}" y2="${gY}" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="3" fill="${color}"/>
    <text x="0" y="${rY - 8}" text-anchor="middle" fill="#3b82f6" font-size="10" font-weight="bold">Rn</text>
    <text x="${tX - 10}" y="${tY + 12}" text-anchor="end" fill="#f97316" font-size="10" font-weight="bold">Tn</text>
    <text x="${gX + 10}" y="${gY + 12}" text-anchor="start" fill="#22c55e" font-size="10" font-weight="bold">γ</text>
  </svg>`;
}

function renderRawTable(el) {
  if (!currentRaw) return;
  let html = `<div style="font-size:11px;color:var(--dim);margin-bottom:10px">Every row = a raw value from an open European dataset. The agent computes doses from these values.</div>`;
  html += `<table class="raw-table"><thead><tr><th>#</th><th>Parameter</th><th>Description</th><th>Value</th><th>Source</th><th>Cov</th></tr></thead><tbody>`;
  for (const group of currentRaw) {
    html += `<tr><td colspan="6" class="group-header">${group.group}</td></tr>`;
    for (const row of group.rows) {
      const badge = row.cov === "EU" ? '<span class="badge-eu">EU</span>' : '<span class="badge-opt">OPT</span>';
      html += `<tr><td>${row.n}</td><td><code>${row.param}</code></td><td>${row.desc}</td><td>${row.val}</td><td>${row.source}</td><td>${badge}</td></tr>`;
    }
  }
  html += `</tbody></table>`;
  el.innerHTML = html;
}

function renderAgentSteps(el) {
  if (!currentFP || !currentRaw) return;
  const steps = generateAgentSteps(currentFP, currentRaw);
  el.innerHTML = steps.map(s => `<div class="agent-step"><span class="step-label">${s.label}</span><div>${s.html}</div></div>`).join("");
}

// ============================================================
// MAP INITIALIZATION
// ============================================================
let map, hoverTimer;
let cursorPos = null;
let hoverData = null;

function initMap() {
  map = new maplibregl.Map({
    container: "map",
    center: [-6.26, 53.35],
    zoom: 10,
    maxZoom: 18,
    minZoom: 3,
    style: {
      version: 8,
      sources: {
        "esri-imagery": { type: "raster", tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"], tileSize: 256, attribution: "© Esri" },
        "esri-labels": { type: "raster", tiles: ["https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}"], tileSize: 256, attribution: "© Esri" },
      },
      layers: [
        { id: "satellite", type: "raster", source: "esri-imagery", minzoom: 0, maxzoom: 18 },
        { id: "labels", type: "raster", source: "esri-labels", minzoom: 0, maxzoom: 18 },
      ],
    },
  });

  map.addControl(new maplibregl.ScaleControl({ maxWidth: 120 }), "bottom-left");
  map.addControl(new maplibregl.NavigationControl(), "top-right");

  map.on("load", () => {
    document.getElementById("mapLoader").style.display = "none";
  });

  map.on("mousemove", (e) => {
    const { lng, lat } = e.lngLat;
    const pixel = e.point;
    cursorPos = { x: pixel.x, y: pixel.y };
    updateFloatTri();

    document.getElementById("statusCoords").textContent = `${lat.toFixed(4)}°, ${lng.toFixed(4)}°`;

    if (hoverTimer) clearTimeout(hoverTimer);
    hoverTimer = setTimeout(() => {
      const lith = getLithologyAt(lng, lat);
      document.getElementById("statusLith").textContent = lith.region;
      if (lith.glim === "water" || lith.glim === "Wa") {
        hoverData = null;
        updateFloatTri();
        return;
      }
      const nf = nearestFault(lng, lat);
      const permeability = "medium"; // default for hover
      const fp = polygonDoseFingerprint({
        lithology: lith.glim, lat, lon: lng,
        permeability, distFaultM: nf.distM, lineamentDensity: 0,
        confidenceOverride: 30,
      });
      hoverData = { fp, name: lith.region };
      updateFloatTri();
    }, 80);
  });

  map.on("click", (e) => {
    const { lng, lat } = e.lngLat;
    const lith = getLithologyAt(lng, lat);
    if (lith.glim === "water" || lith.glim === "Wa") return;
    const nf = nearestFault(lng, lat);
    const fp = polygonDoseFingerprint({
      lithology: lith.glim, lat, lon: lng,
      permeability: "medium", distFaultM: nf.distM, lineamentDensity: 0,
      confidenceOverride: 30,
    });
    currentName = lith.region;
    currentFP = fp;
    currentRaw = generateRawTable(lng, lat, lith);
    renderRightPanel();
  });
}

function updateFloatTri() {
  let el = document.getElementById("floatTri");
  if (!el) {
    el = document.createElement("div");
    el.id = "floatTri";
    el.className = "float-tri";
    document.querySelector(".map-col").appendChild(el);
  }
  if (!cursorPos || !hoverData) {
    el.style.display = "none";
    return;
  }
  el.style.display = "block";
  el.style.left = cursorPos.x + "px";
  el.style.top = cursorPos.y + "px";

  const arms = hoverData.fp.arms_mSv_yr;
  const total = hoverData.fp.total_terrestrial_mSv_yr;
  const tier = hoverData.fp.risk.tier;
  const tc = { GREEN: "#22c55e", AMBER: "#f59e0b", RED: "#ef4444" }[tier];

  const max = Math.max(arms.radon, arms.thoron, arms.gamma, 0.5);
  const scale = 50 / max;
  const rY = -arms.radon * scale;
  const tX = -arms.thoron * scale * 0.87;
  const tY = arms.thoron * scale * 0.5;
  const gX = arms.gamma * scale * 0.87;
  const gY = arms.gamma * scale * 0.5;
  const path = `M 0 ${rY} L ${tX} ${tY} L ${gX} ${gY} Z`;

  el.innerHTML = `
    <svg width="160" height="160" viewBox="-80 -80 160 160" style="overflow:visible">
      <path d="${path}" fill="${tc}15" stroke="none" style="filter:blur(6px)"/>
      <path d="${path}" fill="none" stroke="${tc}" stroke-width="2" stroke-linejoin="round"/>
      <line x1="0" y1="0" x2="0" y2="${rY}" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="${tX}" y2="${tY}" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="${gX}" y2="${gY}" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="3" fill="${tc}"/>
      <text x="0" y="${rY - 6}" text-anchor="middle" fill="#3b82f6" font-size="9" font-weight="bold">Rn</text>
      <text x="${tX - 8}" y="${tY + 10}" text-anchor="end" fill="#f97316" font-size="9" font-weight="bold">Tn</text>
      <text x="${gX + 8}" y="${gY + 10}" text-anchor="start" fill="#22c55e" font-size="9" font-weight="bold">γ</text>
    </svg>
    <div class="tri-tip" style="border-color:${tc}">
      <div class="tot" style="color:${tc}">${total.toFixed(2)} mSv/yr</div>
      <div class="tier" style="background:${tc}">${tier}</div>
    </div>
  `;
}

function handlePreset(val) {
  if (!val) return;
  const [name, latStr, lonStr] = val.split(",");
  const lat = parseFloat(latStr), lon = parseFloat(lonStr);
  map.flyTo({ center: [lon, lat], zoom: 14, essential: true });
  const lith = getLithologyAt(lon, lat);
  const nf = nearestFault(lon, lat);
  const fp = polygonDoseFingerprint({
    lithology: lith.glim, lat, lon,
    permeability: "medium", distFaultM: nf.distM, lineamentDensity: 0,
    confidenceOverride: 30,
  });
  currentName = name;
  currentFP = fp;
  currentRaw = generateRawTable(lon, lat, lith);
  renderRightPanel();
}

async function doSearch() {
  const q = document.getElementById("searchInput").value.trim();
  if (!q) return;
  try {
    const resp = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=1`);
    const data = await resp.json();
    if (data?.[0]) {
      const lat = parseFloat(data[0].lat), lon = parseFloat(data[0].lon);
      map.flyTo({ center: [lon, lat], zoom: 14, essential: true });
      const lith = getLithologyAt(lon, lat);
      const nf = nearestFault(lon, lat);
      const fp = polygonDoseFingerprint({
        lithology: lith.glim, lat, lon,
        permeability: "medium", distFaultM: nf.distM, lineamentDensity: 0,
        confidenceOverride: 30,
      });
      currentName = data[0].display_name.split(",")[0];
      currentFP = fp;
      currentRaw = generateRawTable(lon, lat, lith);
      renderRightPanel();
    }
  } catch (e) { console.error("Search failed:", e); }
}

// Start
window.addEventListener("DOMContentLoaded", () => {
  initMap();
  renderRightPanel();
});
</script>
