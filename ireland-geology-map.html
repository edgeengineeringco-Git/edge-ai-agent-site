<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ireland — Satellite &amp; 100K Bedrock Geology</title>

  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
  />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    html, body { margin: 0; height: 100%; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
    #map { position: absolute; inset: 0; }

    #topbar {
      position: absolute; top: 10px; left: 10px; z-index: 1000;
      background: rgba(255,255,255,0.95); padding: 10px 12px; border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25); max-width: 330px;
    }
    #topbar h1 { font-size: 15px; margin: 0 0 8px; }
    #topbar label { font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer; }
    #status { font-size: 12px; color: #555; margin-top: 6px; }

    #panel {
      position: absolute; bottom: 10px; left: 10px; z-index: 1000;
      background: rgba(255,255,255,0.97); padding: 12px 14px; border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25); width: 320px; max-height: 55%; overflow: auto;
      font-size: 13px; line-height: 1.45;
    }
    #panel h2 { font-size: 14px; margin: 0 0 8px; }
    #panel table { width: 100%; border-collapse: collapse; }
    #panel td { padding: 2px 4px; vertical-align: top; }
    #panel td.k { font-weight: 600; white-space: nowrap; padding-right: 8px; color: #333; }
    .hint { color: #777; font-style: italic; }
    .err { color: #b00; }
    .sw { display: inline-block; width: 12px; height: 12px; border: 1px solid #555; border-radius: 2px; vertical-align: middle; margin-right: 5px; }

    #legend {
      position: absolute; top: 10px; right: 10px; z-index: 1000;
      background: rgba(255,255,255,0.95); padding: 10px 12px; border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.25); font-size: 12px; max-height: 70%; overflow: auto;
      display: none; max-width: 230px;
    }
    #legend b { font-size: 13px; display: block; margin-bottom: 4px; }
    .lg-row { display: flex; align-items: center; gap: 7px; margin-top: 5px; }
    .lg-sw { width: 14px; height: 14px; border: 1px solid #555; border-radius: 3px; flex: 0 0 auto; }

    #loader {
      position: absolute; inset: 0; z-index: 2000; display: flex; align-items: center; justify-content: center;
      background: #0d1117; color: #c9d1d9; font-size: 15px; text-align: center; padding: 20px;
    }
    .bar { width: 240px; height: 6px; background: #30363d; border-radius: 4px; margin-top: 12px; overflow: hidden; }
    .bar > div { height: 100%; width: 40%; background: #2f81f7; animation: slide 1.1s infinite; }
    @keyframes slide { 0% { margin-left: -40%; } 100% { margin-left: 100%; } }
  </style>
</head>
<body>
  <div id="map"></div>

  <div id="loader">
    <div>
      <div style="font-size:38px">🛰️</div>
      <div>Loading 100K bedrock geology…</div>
      <div class="bar"><div></div></div>
    </div>
  </div>

  <div id="topbar">
    <h1>🛰️ Ireland — Satellite + 100K Geology</h1>
    <label>
      <input type="checkbox" id="toggleGeology" disabled />
      Show 100K Bedrock Geology
    </label>
    <div id="status">Loading geology data…</div>
  </div>

  <div id="legend"></div>

  <div id="panel">
    <h2>📍 Details</h2>
    <p class="hint">Click a point on the map to inspect coordinates and bedrock geology.</p>
  </div>

  <script>
    // =====================================================================
    // CONFIG  — geology data is hosted in THIS repo (same origin on GitHub
    // Pages / raw), so there are NO CORS issues. A raw-URL fallback is used
    // in case the page is opened from a different context.
    // =====================================================================
    const GEOLOGY_URLS = [
      "./data/geology-100k.geojson",
      "https://raw.githubusercontent.com/edgeengineeringco-Git/edge-ai-agent-site/main/data/geology-100k.geojson"
    ];

    const SATELLITE_URL =
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}";
    const SATELLITE_ATTR =
      "Imagery &copy; Esri, Maxar, Earthstar Geographics, and the GIS User Community";
    const GEOLOGY_ATTR = "Bedrock Geology &copy; GSI (CC-BY-4.0)";

    const IRELAND_CENTER = [53.4, -8.0];
    const IRELAND_ZOOM = 7;
    const IRELAND_BOUNDS = [[51.4, -11.0], [55.6, -5.3]];

    // =====================================================================
    // GEOLOGICAL COLOR SCHEME
    // GSI 100K unit names are lithology-based (not age-based), so we classify
    // each unit by rock type / age from its name + description, then colour it
    // with a standard geological palette. Irish limestones are Carboniferous.
    // =====================================================================
    const GEO_CLASSES = [
      { key: "quaternary", label: "Quaternary / Drift",      color: "#f3e8a0" },
      { key: "carboniferous", label: "Carboniferous (limestone)", color: "#aebcc9" },
      { key: "devonian",    label: "Devonian",               color: "#c2a878" },
      { key: "silurian",    label: "Silurian",               color: "#9ccfe0" },
      { key: "ordovician",  label: "Ordovician",             color: "#76c4a8" },
      { key: "cambrian",    label: "Cambrian",               color: "#b6e0a0" },
      { key: "cretaceous",  label: "Cretaceous",             color: "#9ac464" },
      { key: "triassic",    label: "Triassic / Permian",     color: "#a78cf0" },
      { key: "metamorphic", label: "Metamorphic",            color: "#d98cb3" },
      { key: "intrusive",   label: "Igneous — Intrusive",    color: "#e8954a" },
      { key: "volcanic",    label: "Igneous — Volcanic",     color: "#cf4520" },
      { key: "sedimentary", label: "Sedimentary (clastic, undivided)", color: "#e3d6a0" },
      { key: "other",       label: "Other / undivided",      color: "#cdbf9e" },
    ];
    const GEO_COLOR = Object.fromEntries(GEO_CLASSES.map((c) => [c.key, c.color]));
    const EARTH_TONES = ["#cdbf9e","#c9b48f","#b9a07c","#a8b0a0","#bcc6b0","#c8b89c","#bfae8e","#cad2c0","#c2b9a0","#b0a890","#c6b8a0","#b8c0a8"];

    function hashStr(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; }

    function classify(p) {
      const t = ((p.UNIT_NAME || "") + " " + (p.DESCRIPT || "") + " " + (p.STRATCODE || "")).toLowerCase();
      if (/quaternary|glacial|drift|till|esker|alluv|peat|bog|holocene|pleistocene/.test(t)) return "quaternary";
      if (/cretaceous/.test(t)) return "cretaceous";
      if (/carboniferous|visean|tournaisian|namurian|westphalian|dinantian|waulsortian|lower limestone|calp/.test(t)) return "carboniferous";
      if (/devonian|old red sandstone|\bors\b/.test(t)) return "devonian";
      if (/silurian/.test(t)) return "silurian";
      if (/ordovician|arenig|llanvirn|caradoc|ashgill|tremadoc/.test(t)) return "ordovician";
      if (/cambrian/.test(t)) return "cambrian";
      if (/triassic|permian|permo|mercia|sherwood|keuper|bunter/.test(t)) return "triassic";
      if (/basalt|andesite|rhyolite|trachyte|dacite|ignimbrite|volcan|tuff|agglomerate|lava|extrusive|pyroclastic|hawaiite/.test(t)) return "volcanic";
      if (/granite|granodiorite|adamellite|syenite|diorite|tonalite|tonalitic|aplite|pegmatite|microgranite|porphyry|felsite|quartz[\s-]?porphyry|granitic/.test(t)) return "intrusive";
      if (/schist|gneiss|migmatite|amphibolite|marble|quartzite|metadolerite|metabasite|metagabbro|slate|phyllite|psammite|pelite|paragneiss|metasediment|metamorphic|dalradian|moine|slishwood|kinrovar|ox mountains|annagh|inishkea|rhinns/.test(t)) return "metamorphic";
      if (/limestone|dolomite|oolite|oolitic|micrite|chert|calcareous/.test(t)) return "carboniferous"; // Irish limestones are Carboniferous
      if (/sandstone|shale|mudstone|conglomerate|grit|flagstone|siltstone|clay|arenite|greywacke|graywacke/.test(t)) return "sedimentary";
      return "other";
    }
    function classColor(p) {
      const k = classify(p);
      if (k !== "other") return GEO_COLOR[k] || "#cdbf9e";
      return EARTH_TONES[hashStr(p.STRATCODE || p.UNIT_NAME || "") % EARTH_TONES.length];
    }
    function classLabel(p) {
      const k = classify(p);
      if (k === "other") return "Other / undivided";
      return (GEO_CLASSES.find((c) => c.key === k) || {}).label || k;
    }

    // =====================================================================
    // MAP
    // =====================================================================
    const map = L.map("map", {
      center: IRELAND_CENTER,
      zoom: IRELAND_ZOOM,
      maxBounds: IRELAND_BOUNDS,
      maxBoundsViscosity: 0.7,
      preferCanvas: true,
    });
    L.tileLayer(SATELLITE_URL, { maxZoom: 18, attribution: SATELLITE_ATTR }).addTo(map);

    const panel = document.getElementById("panel");
    const statusEl = document.getElementById("status");
    const toggle = document.getElementById("toggleGeology");
    const loader = document.getElementById("loader");

    let geologyLayer = null;
    let geologyFeatures = [];

    async function loadGeology() {
      let fc = null, lastErr = null;
      for (const url of GEOLOGY_URLS) {
        try {
          const res = await fetch(url);
          if (!res.ok) throw new Error("HTTP " + res.status);
          fc = await res.json();
          break;
        } catch (e) { lastErr = e; }
      }
      if (!fc) {
        loader.innerHTML = '<div class="err">Could not load geology data.<br>' + esc(lastErr ? lastErr.message : "unknown error") + "</div>";
        statusEl.textContent = "Failed to load geology data.";
        return;
      }
      geologyFeatures = fc.features || [];
      geologyLayer = L.geoJSON(fc, {
        style: (feature) => ({
          color: "#3a3a3a", weight: 0.5, opacity: 0.6,
          fillColor: classColor(feature.properties),
          fillOpacity: 0.6,
        }),
      });
      toggle.disabled = false;
      statusEl.textContent = `Geology loaded (${geologyFeatures.length} units). Toggle on, then click a point.`;

      // Build legend from classes actually present in the data
      const present = new Set(geologyFeatures.map((f) => classify(f.properties)));
      const legend = document.getElementById("legend");
      legend.innerHTML =
        "<b>Geology (rock type)</b>" +
        GEO_CLASSES.filter((c) => present.has(c.key))
          .map((c) => `<div class="lg-row"><span class="lg-sw" style="background:${c.color}"></span>${esc(c.label)}</div>`)
          .join("");
      legend.style.display = "block";

      loader.style.display = "none";
    }

    toggle.addEventListener("change", () => {
      if (!geologyLayer) return;
      if (toggle.checked) {
        geologyLayer.addTo(map);
        statusEl.textContent = "100K geology ON. Click a point for details.";
      } else {
        map.removeLayer(geologyLayer);
        statusEl.textContent = "100K geology OFF.";
      }
    });

    // =====================================================================
    // CLICK → point-in-polygon lookup (client-side, no network)
    // =====================================================================
    map.on("click", (e) => {
      const lat = e.latlng.lat, lon = e.latlng.lng;
      const found = findGeology(lat, lon);
      renderDetails(lat, lon, found);
    });

    function pointInRing(ring, x, y) {
      let inside = false;
      for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
        const xi = ring[i][0], yi = ring[i][1];
        const xj = ring[j][0], yj = ring[j][1];
        if ((yi > y) !== (yj > y) && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi) inside = !inside;
      }
      return inside;
    }
    function pointInPolygon(poly, x, y) {
      if (!pointInRing(poly[0], x, y)) return false;
      for (let h = 1; h < poly.length; h++) if (pointInRing(poly[h], x, y)) return false;
      return true;
    }
    function findGeology(lat, lon) {
      if (!geologyFeatures.length) return { error: "Geology data not loaded yet." };
      for (const f of geologyFeatures) {
        const g = f.geometry;
        if (g.type === "Polygon") {
          if (pointInPolygon(g.coordinates, lon, lat)) return f.properties;
        } else if (g.type === "MultiPolygon") {
          for (const poly of g.coordinates) if (pointInPolygon(poly, lon, lat)) return f.properties;
        }
      }
      return null;
    }
    function renderDetails(lat, lon, found) {
      const head =
        `<h2>📍 Details</h2><table>` +
        `<tr><td class="k">Latitude</td><td>${lat.toFixed(5)}</td></tr>` +
        `<tr><td class="k">Longitude</td><td>${lon.toFixed(5)}</td></tr></table>`;
      if (found && found.error) { panel.innerHTML = head + `<p class="err">${esc(found.error)}</p>`; return; }
      if (!found) {
        panel.innerHTML = head + `<p class="hint">No bedrock geology polygon at this point (possibly offshore or outside the dataset).</p>`;
        return;
      }
      const cls = classColor(found);
      const clsRow = `<tr><td class="k">Geology</td><td><span class="sw" style="background:${cls}"></span>${esc(classLabel(found))}</td></tr>`;
      const rows = [
        ["Unit Name", found.UNIT_NAME],
        ["Description", found.DESCRIPT],
        ["Stratigraphic Code", found.STRATCODE],
        ["New Code", found.NEWCODE],
        ["Label", found.LABEL],
      ]
        .filter(([, v]) => v !== null && v !== undefined && v !== "")
        .map(([k, v]) => `<tr><td class="k">${esc(k)}</td><td>${esc(v)}</td></tr>`)
        .join("");
      panel.innerHTML = head + clsRow + `<table>${rows}</table>`;
    }
    function esc(s) {
      return String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
    }

    loadGeology();
  </script>
</body>
</html>
