<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Irish Terrestrial Dose Indicator</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f1117;color:#e6ebf5;font-family:'Inter',system-ui,sans-serif;height:100vh;overflow:hidden}

.header{position:fixed;top:0;left:0;right:0;height:48px;background:#1a1d26;border-bottom:1px solid #2a2d36;
  display:flex;align-items:center;padding:0 16px;z-index:100;gap:12px}
.header h1{font-size:15px;font-weight:700;color:#3b82f6;white-space:nowrap}
.search-box{flex:1;max-width:320px;position:relative}
.search-box input{width:100%;background:#0f1117;border:1px solid #2a2d36;border-radius:6px;padding:6px 30px 6px 10px;
  color:#e6ebf5;font-size:13px}
.search-box input:focus{outline:none;border-color:#3b82f6}
.search-box button{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:none;
  color:#8b97b0;cursor:pointer;font-size:14px}
.status-bar{font-size:11px;color:#8b97b0;white-space:nowrap}
.spinner{display:inline-block;width:12px;height:12px;border:2px solid #3b82f633;border-top-color:#3b82f6;
  border-radius:50%;animation:spin 0.8s linear infinite;margin-left:6px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}

#map{position:fixed;top:48px;left:0;right:0;bottom:280px}

.bottom-panel{position:fixed;bottom:0;left:0;right:0;height:280px;background:#1a1d26;
  border-top:1px solid #2a2d36;display:flex;z-index:100}

.data-sources{flex:1;overflow-y:auto;padding:10px;font-size:11px}
.data-sources h3{font-size:12px;color:#3b82f6;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
.ds-table{width:100%;border-collapse:collapse}
.ds-table th{text-align:left;color:#8b97b0;font-weight:500;padding:3px 6px;border-bottom:1px solid #2a2d36}
.ds-table td{padding:3px 6px;border-bottom:1px solid #1f2230}
.ds-ok{color:#22c55e} .ds-prior{color:#f59e0b} .ds-miss{color:#ef4444}

.dose-panel{flex:0 0 380px;border-left:1px solid #2a2d36;padding:10px;overflow-y:auto}
.dose-panel h3{font-size:12px;color:#3b82f6;margin-bottom:8px;text-transform:uppercase;letter-spacing:1px}
.risk-badge{display:inline-block;padding:3px 12px;border-radius:12px;font-size:11px;font-weight:700}
.risk-GREEN{background:#22c55e22;color:#22c55e;border:1px solid #22c55e44}
.risk-AMBER{background:#f59e0b22;color:#f59e0b;border:1px solid #f59e0b44}
.risk-RED{background:#ef444422;color:#ef4444;border:1px solid #ef444444}
.summary-row{display:flex;justify-content:space-between;padding:3px 0;font-size:12px}
.summary-row .label{color:#8b97b0}
.summary-row .value{font-weight:600}
.short-report{margin-top:8px;font-size:11px;color:#8b97b0;line-height:1.5}
.short-report p{margin-bottom:3px}
.conf-bar{height:6px;background:#243049;border-radius:3px;margin:4px 0}
.conf-fill{height:100%;border-radius:3px}
.source-tag{display:inline-block;font-size:9px;padding:1px 6px;border-radius:4px;margin:1px;
  background:#243049;color:#8b97b0}
.source-tag.measured{background:#22c55e22;color:#22c55e}
.source-tag.prior{background:#f59e0b22;color:#f59e0b}

.layer-panel{position:fixed;top:48px;right:8px;background:#1a1d26;border:1px solid #2a2d36;border-radius:8px;
  padding:10px;z-index:100;max-height:calc(100vh - 340px);overflow-y:auto;width:260px;font-size:11px;display:none}
.layer-panel h3{font-size:11px;color:#3b82f6;margin-bottom:6px;text-transform:uppercase;letter-spacing:1px}
.layer-item{display:flex;align-items:center;gap:6px;padding:2px 0}
.layer-item input[type=checkbox]{accent-color:#3b82f6}
.layer-toggle-btn{position:fixed;top:56px;right:8px;background:#1a1d26;border:1px solid #2a2d36;
  border-radius:6px;padding:6px 10px;color:#3b82f6;cursor:pointer;z-index:99;font-size:11px}
</style>
</head>
<body>

<div class="header">
  <h1>🇮🇪 Irish Terrestrial Dose</h1>
  <div class="search-box">
    <input id="searchInput" placeholder="Search town or Eircode...">
    <button id="searchBtn">🔍</button>
  </div>
  <div class="status-bar" id="statusCoords">Click map to analyse</div>
</div>

<div id="map"></div>

<button class="layer-toggle-btn" id="layerToggleBtn">☰ Layers</button>
<div class="layer-panel" id="layerPanel">
  <h3>WMS Overlays</h3>
  <div id="layerList"></div>
</div>

<div class="bottom-panel">
  <div class="data-sources">
    <h3>Data Sources & Provenance</h3>
    <div id="dsContent">
      <p style="color:#8b97b0;font-size:11px">Click any point in Ireland to query the backend API and see data source status.</p>
    </div>
  </div>
  <div class="dose-panel">
    <h3>Dose Analysis</h3>
    <div id="doseContent">
      <p style="color:#8b97b0;font-size:11px">Dose results will appear here after clicking the map.</p>
    </div>
  </div>
</div>

<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
<script>

// ═════════════════════════════════════════════════════════════════════════════
// CONFIGURATION
// ═════════════════════════════════════════════════════════════════════════════

// Backend API URL — change this to your deployed backend
const API_BASE = "http://localhost:8000";

// WMS overlay sources (for map display only — dose comes from API)
const WMS_LAYERS = [
  { id: "bedrock", name: "GSI Bedrock 1:100k", group: "GSI",
    url: "https://gsi.geodata.gov.ie/server/services/Bedrock/IE_GSI_Bedrock_Geology_Datasets_100K_IE26_ITM/MapServer/WMSServer",
    layer: "IE_GSI_Bedrock_Geology_100K_IE26_ITM", color: "#e74c3c" },
  { id: "quaternary", name: "GSI Quaternary", group: "GSI",
    url: "https://gsi.geodata.gov.ie/server/services/Quaternary/IE_GSI_Quaternary_Sediments_50K_IE26_ITM/MapServer/WMSServer",
    layer: "IE_GSI_Quaternary_Sediments_50K_IE26_ITM", color: "#f39c12" },
  { id: "groundwater", name: "GSI Groundwater", group: "GSI",
    url: "https://gsi.geodata.gov.ie/server/services/Groundwater/IE_GSI_Groundwater_Recharge_40K_IE26_ITM/MapServer/WMSServer",
    layer: "IE_GSI_Groundwater_Recharge_40K_IE26_ITM", color: "#3498db" },
  { id: "geochem", name: "GSI Geochemistry (La)", group: "GSI",
    url: "https://gsi.geodata.gov.ie/server/services/Geochemistry/IE_GSI_Geochemistry_Stream_Sediment_C_250m_IE26_ITM_GRID/MapServer/WMSServer",
    layer: "C_XRFS_Lanthanum_(La)_(mg_kg¯¹)52276", color: "#9b59b6" },
  { id: "faults", name: "GSI Faults", group: "GSI",
    url: "https://gsi.geodata.gov.ie/server/services/Bedrock/IE_GSI_Bedrock_Geology_Datasets_100K_IE26_ITM/MapServer/WMSServer",
    layer: "IE_GSI_Geological_Lines_100K_IE26_ITM", color: "#e67e22" },
  { id: "radon", name: "EPA Radon Risk", group: "EPA",
    url: "http://gis.epa.ie/geoserver/EPA/wms",
    layer: "EPA:RadonRiskMapofIreland", color: "#e74c3c" },
  { id: "soils", name: "Teagasc Soils", group: "Teagasc",
    url: "http://gis.epa.ie/geoserver/EPA/wms",
    layer: "EPA:SOIL_SISNationalSoils", color: "#27ae60" },
];

const RC = { GREEN: "#22c55e", AMBER: "#f59e0b", RED: "#ef4444" };
const IE = { minLat: 51.4, maxLat: 55.4, minLon: -10.6, maxLon: -5.3 };

// ═════════════════════════════════════════════════════════════════════════════
// MAP INITIALIZATION
// ═════════════════════════════════════════════════════════════════════════════

const map = new maplibregl.Map({
  container: "map",
  center: [-8.5, 53.3], zoom: 7,
  maxBounds: [[-10.7, 51.3], [-5.2, 55.5]],
  style: {
    version: 8,
    sources: {
      "esri-imagery": { type: "raster", tiles: [
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"
      ], tileSize: 256 },
      "esri-labels": { type: "raster", tiles: [
        "https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}"
      ], tileSize: 256 },
    },
    layers: [
      { id: "satellite", type: "raster", source: "esri-imagery" },
      { id: "labels", type: "raster", source: "esri-labels" },
    ],
  },
});
map.addControl(new maplibregl.NavigationControl(), "top-right");

// Add WMS overlay layers
let wmsIdx = 0;
WMS_LAYERS.forEach(src => {
  const sourceId = `wms-${src.id}`;
  const layerId = `wms-layer-${src.id}`;
  try {
    map.addSource(sourceId, {
      type: "raster",
      tiles: [`${src.url}?service=WMS&version=1.3.0&request=GetMap&layers=${encodeURIComponent(src.layer)}&crs=EPSG:3857&bbox={bbox-epsg-3857}&width=256&height=256&format=image/png&transparent=true`],
      tileSize: 256,
    });
    map.addLayer({ id: layerId, type: "raster", source: sourceId, paint: { "raster-opacity": 0.5 } });
    map.setLayoutProperty(layerId, "visibility", "none"); // off by default
    src._layerId = layerId;
  } catch (e) { console.warn(`Failed to add WMS ${src.name}:`, e); }
});

// Populate layer toggle panel
const layerList = document.getElementById("layerList");
const groups = {};
WMS_LAYERS.forEach(s => { if (!groups[s.group]) groups[s.group] = []; groups[s.group].push(s); });
Object.entries(groups).forEach(([group, sources]) => {
  layerList.innerHTML += `<div style="margin-bottom:8px">
    <div style="font-size:10px;color:#8b97b0;font-weight:600;text-transform:uppercase;margin-bottom:3px">${group}</div>
    ${sources.map(s => `<label class="layer-item"><input type="checkbox" data-layer="${s.id}"><span>${s.name}</span></label>`).join('')}
  </div>`;
});

document.getElementById("layerToggleBtn").addEventListener("click", () => {
  const p = document.getElementById("layerPanel");
  p.style.display = p.style.display === "none" ? "block" : "none";
});
layerList.addEventListener("change", e => {
  if (e.target.type === "checkbox") {
    const src = WMS_LAYERS.find(s => s.id === e.target.dataset.layer);
    if (src && src._layerId) {
      map.setLayoutProperty(src._layerId, "visibility", e.target.checked ? "visible" : "none");
    }
  }
});

// ═════════════════════════════════════════════════════════════════════════════
// API INTERACTION
// ═════════════════════════════════════════════════════════════════════════════

let loading = false;

async function queryDose(lat, lon) {
  if (loading) return;
  loading = true;
  const status = document.getElementById("statusCoords");
  status.innerHTML = `Querying backend for ${lat.toFixed(4)}°N, ${lon.toFixed(4)}°W <span class="spinner"></span>`;

  try {
    const resp = await fetch(`${API_BASE}/dose?lat=${lat}&lon=${lon}`);
    if (!resp.ok) throw new Error(`API error: ${resp.status}`);
    const data = await resp.json();
    renderDose(data);
    renderSources(data);
    status.textContent = `${lat.toFixed(4)}°N, ${lon.toFixed(4)}°W — ${data.risk.tier} — ${data.total_terrestrial_mSv_yr.toFixed(2)} mSv/yr`;
  } catch (err) {
    status.textContent = `Error: ${err.message}`;
    document.getElementById("doseContent").innerHTML = `<p style="color:#ef4444">Backend API error: ${err.message}. Is the backend running at ${API_BASE}?</p>`;
  }
  loading = false;
}

function renderDose(d) {
  const c = RC[d.risk.tier] || "#22c55e";
  const confColor = d.confidence.score >= 75 ? "#22c55e" : d.confidence.score >= 50 ? "#f59e0b" : "#ef4444";

  document.getElementById("doseContent").innerHTML = `
    <div class="summary-row"><span class="label">Location</span><span class="value">${d.lat.toFixed(4)}°N, ${d.lon.toFixed(4)}°W</span></div>
    <div class="summary-row"><span class="label">Cell</span><span class="value">${d.cell_m}m</span></div>
    <div class="summary-row"><span class="label">Risk</span><span class="risk-badge risk-${d.risk.tier}">${d.risk.tier}</span></div>
    <div class="summary-row"><span class="label">Total Dose</span><span class="value" style="color:${c};font-size:16px">${d.total_terrestrial_mSv_yr.toFixed(2)} mSv/yr</span></div>
    <div class="summary-row"><span class="label">vs UNSCEAR</span><span class="value">${(d.total_terrestrial_mSv_yr / 2.2).toFixed(1)}× world avg</span></div>
    <hr style="border:none;border-top:1px solid #243049;margin:6px 0">
    <div class="summary-row"><span class="label">Radon</span><span class="value">${d.arms_mSv_yr.radon.toFixed(2)} mSv/yr</span></div>
    <div class="summary-row"><span class="label">Thoron</span><span class="value">${d.arms_mSv_yr.thoron.toFixed(2)} mSv/yr</span></div>
    <div class="summary-row"><span class="label">Gamma</span><span class="value">${d.arms_mSv_yr.gamma.toFixed(2)} mSv/yr</span></div>
    <hr style="border:none;border-top:1px solid #243049;margin:6px 0">
    <div class="summary-row"><span class="label">Indoor Rn</span><span class="value">${d.radon_Bq_m3.toFixed(0)} Bq/m³ ${d.radon_Bq_m3 >= 200 ? '⚠' : ''}</span></div>
    <div class="summary-row"><span class="label">Ra-eq</span><span class="value">${d.ra_eq_Bq_kg.toFixed(0)} Bq/kg ${d.ra_eq_Bq_kg >= 370 ? '⚠' : ''}</span></div>
    <div class="summary-row"><span class="label">Gamma rate</span><span class="value">${d.gamma_rate_nGy_h.toFixed(0)} nGy/h</span></div>
    <div class="summary-row"><span class="label">Season</span><span class="value">${d.season}</span></div>
    <hr style="border:none;border-top:1px solid #243049;margin:6px 0">
    <div class="summary-row"><span class="label">Confidence</span><span class="value" style="color:${confColor}">${d.confidence.level} (${d.confidence.score}%)</span></div>
    <div class="conf-bar"><div class="conf-fill" style="width:${d.confidence.score}%;background:${confColor}"></div></div>
    <div class="summary-row"><span class="label">Reason</span><span class="value">${d.confidence.reason}</span></div>
    <hr style="border:none;border-top:1px solid #243049;margin:6px 0">
    <div class="short-report">${d.report_short.map(l => `<p>${l}</p>`).join('')}</div>
    <hr style="border:none;border-top:1px solid #243049;margin:6px 0">
    <div style="font-size:10px;color:#8b97b0">
      <div style="margin-bottom:4px;font-weight:600;color:#3b82f6">Provenance</div>
      ${d.provenance.map(p => `<div>→ ${p}</div>`).join('')}
    </div>
    <hr style="border:none;border-top:1px solid #243049;margin:6px 0">
    <div style="font-size:10px;color:#8b97b0">
      <div style="margin-bottom:4px;font-weight:600;color:#3b82f6">Standards</div>
      <div>GREEN: ≤ 2.2 mSv/yr (≤ world avg)</div>
      <div>AMBER: 2.2–6.6 mSv/yr (1–3× avg)</div>
      <div>RED: > 6.6 mSv/yr or Rn ≥ 200 Bq/m³</div>
      <div style="margin-top:4px;opacity:0.6">Irish 200 Bq/m³ action level · EU BSS 2013/59/Euratom</div>
    </div>
  `;
}

function renderSources(d) {
  const ds = d.data_sources || {};
  const html = Object.entries(ds).map(([key, src]) => {
    const isMeasured = src.includes("raster") || src.includes("measured") || src.includes("EPA") || src.includes("Tellus");
    const isPrior = src.includes("prior") || src.includes("model") || src.includes("GRP");
    const cls = isMeasured ? "ds-ok" : isPrior ? "ds-prior" : "ds-miss";
    const icon = isMeasured ? "✓" : isPrior ? "~" : "✗";
    return `<tr><td>${key}</td><td class="${cls}">${icon} ${src}</td></tr>`;
  }).join('');

  document.getElementById("dsContent").innerHTML = `
    <table class="ds-table">
      <thead><tr><th>Parameter</th><th>Source</th></tr></thead>
      <tbody>${html}</tbody>
    </table>
    <div style="margin-top:8px;font-size:10px;color:#8b97b0">
      <span class="source-tag measured">✓ Raster/WMS</span>
      <span class="source-tag prior">~ Prior/Model</span>
      <span class="source-tag" style="color:#ef4444">✗ Missing</span>
    </div>
  `;
}

// ═════════════════════════════════════════════════════════════════════════════
// EVENT HANDLERS
// ═════════════════════════════════════════════════════════════════════════════

map.on("click", e => {
  const { lat, lng } = e.lngLat;
  if (lat < 51.4 || lat > 55.4 || lng < -10.6 || lng > -5.3) {
    document.getElementById("statusCoords").textContent = "Outside Ireland";
    return;
  }
  queryDose(lat, lng);
});

document.getElementById("searchBtn").addEventListener("click", async () => {
  const q = document.getElementById("searchInput").value.trim();
  if (!q) return;
  try {
    const resp = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q + ", Ireland")}&limit=1`);
    const data = await resp.json();
    if (data && data[0]) {
      const lat = parseFloat(data[0].lat), lon = parseFloat(data[0].lon);
      if (lat >= 51.4 && lat <= 55.4 && lon >= -10.6 && lon <= -5.3) {
        map.flyTo({ center: [lon, lat], zoom: 14, essential: true });
        setTimeout(() => queryDose(lat, lon), 1000);
      } else { alert("Location outside Ireland."); }
    }
  } catch (err) { console.error("Search failed:", err); }
});

document.getElementById("searchInput").addEventListener("keydown", e => {
  if (e.key === "Enter") document.getElementById("searchBtn").click();
});

</script>
</body>
</html>
