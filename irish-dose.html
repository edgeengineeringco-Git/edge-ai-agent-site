<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Irish Terrestrial Dose Indicator</title>
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0e1a;color:#e6ebf5;font-family:Inter,system-ui,-apple-system,sans-serif;height:100vh;overflow:hidden;font-size:13px}
.app{display:flex;height:100vh;width:100vw}
.map-pane{flex:1.5;position:relative;min-width:0}
.report-pane{flex:1;min-width:380px;max-width:520px;background:#111726;border-left:1px solid #243049;overflow-y:auto;padding:16px 18px}

/* MAP OVERLAYS */
.map-search{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:10;width:320px}
.map-search input{width:100%;background:#111726ee;border:1px solid #243049;border-radius:8px;padding:8px 12px;color:#e6ebf5;font-size:13px;outline:none}
.map-search input:focus{border-color:#3b82f6}
.map-search input::placeholder{color:#8b97b0}
.search-msg{font-size:11px;color:#8b97b0;margin-top:4px;text-align:center;min-height:16px}

.basemap-toggle{position:absolute;top:12px;left:12px;z-index:10;display:flex;gap:2px;background:#111726ee;border-radius:8px;border:1px solid #243049;overflow:hidden}
.basemap-toggle button{background:none;border:none;color:#8b97b0;padding:6px 10px;font-size:11px;cursor:pointer;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.basemap-toggle button.active{background:#3b82f6;color:#fff}

.badges{position:absolute;bottom:12px;left:12px;z-index:10;display:flex;gap:6px;align-items:center}
.badge{background:#111726ee;border:1px solid #243049;border-radius:6px;padding:3px 8px;font-size:10px;font-weight:600;letter-spacing:.3px}
.badge-green{color:#22c55e;border-color:#22c55e44}

.pin-overlay{position:absolute;top:60px;left:50%;transform:translateX(-50%);z-index:10;background:#f59e0b22;border:1px solid #f59e0b66;color:#f59e0b;padding:4px 12px;border-radius:6px;font-size:11px;font-weight:600;display:none}

/* CURSOR TRIANGLE */
.cursor-tri{position:fixed;z-index:9999;pointer-events:none;opacity:0;transition:opacity 150ms;width:48px;height:48px}
.cursor-tri.visible{opacity:1}
.cursor-tri svg{width:48px;height:48px}

/* RISK CHOROPLETH */
#choropleth-source{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:5}

/* REPORT PANEL */
.report-pane h2{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:#8b97b0;margin-bottom:8px;font-weight:600}
.report-pane h3{font-size:12px;color:#e6ebf5;margin-bottom:6px;font-weight:600}
.card{background:#161e30;border:1px solid #243049;border-radius:12px;padding:14px 16px;margin-bottom:14px}

.empty-state{display:flex;align-items:center;justify-content:center;height:100%;text-align:center;color:#8b97b0;font-size:14px;line-height:1.6}

.risk-pill{display:inline-block;padding:4px 14px;border-radius:14px;font-size:12px;font-weight:700;margin-right:8px}
.risk-GREEN{background:#22c55e22;color:#22c55e;border:1px solid #22c55e44}
.risk-AMBER{background:#f59e0b22;color:#f59e0b;border:1px solid #f59e0b44}
.risk-RED{background:#ef444422;color:#ef4444;border:1px solid #ef444444}
.risk-INSUFFICIENT{background:#8b97b022;color:#8b97b0;border:1px solid #8b97b044}
@keyframes pulse-border{0%,100%{border-color:transparent}50%{border-color:#3b82f6}}
.updating .risk-pill{animation:pulse-border 1.2s ease infinite}

.loc-header{font-size:12px;color:#8b97b0;margin-bottom:10px}

.dose-row{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12px}
.dose-swatch{width:10px;height:10px;border-radius:2px;flex-shrink:0}
.dose-label{color:#8b97b0;flex:1}
.dose-value{font-weight:600;color:#e6ebf5}
.dose-total{border-top:1px solid #243049;margin-top:4px;padding-top:6px;font-weight:700}

.factor-row{display:flex;align-items:center;gap:6px;padding:4px 0;font-size:11px;border-bottom:1px solid #24304911}
.factor-name{color:#8b97b0;width:110px;flex-shrink:0}
.factor-value{flex:1;color:#e6ebf5}
.factor-dir{font-weight:700;width:20px;text-align:center}
.dir-up{color:#f59e0b}.dir-down{color:#22c55e}.dir-neutral{color:#8b97b0}.dir-varies{color:#3b82f6}

.conf-bar{height:6px;background:#243049;border-radius:3px;overflow:hidden;margin:6px 0}
.conf-fill{height:100%;border-radius:3px;transition:width 300ms ease}
.conf-text{font-size:11px;color:#8b97b0}

.source-badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:4px;margin:2px;background:#22c55e22;color:#22c55e;font-weight:600}

.provenance{font-size:10px;color:#8b97b0;line-height:1.5;margin-top:8px}
.provenance strong{color:#3b82f6;font-weight:600}

.why-dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:6px;vertical-align:middle}
.dot-amber{background:#f59e0b}.dot-green{background:#22c55e}.dot-blue{background:#3b82f6}

.error-banner{background:#ef444422;border:1px solid #ef444466;color:#ef4444;padding:8px 12px;border-radius:8px;font-size:12px;margin-bottom:10px;display:none}
.water-banner{background:#3b82f622;border:1px solid #3b82f666;color:#3b82f6;padding:12px;border-radius:8px;text-align:center;font-size:13px;margin-bottom:10px}
</style>
</head>
<body>
<div class="app">
  <!-- LEFT: MAP -->
  <div class="map-pane" id="mapPane">
    <div id="map" style="width:100%;height:100%"></div>

    <div class="basemap-toggle">
      <button id="btnSat" class="active">Satellite</button>
      <button id="btnBing">Bing</button>
      <button id="btnStreets">Streets</button>
    </div>

    <div class="map-search">
      <input id="searchInput" placeholder="Search town or Eircode&hellip;">
      <div class="search-msg" id="searchMsg"></div>
    </div>

    <div class="pin-overlay" id="pinOverlay">📌 Pinned &mdash; click to unpin</div>

    <div class="badges" id="badges">
      <span class="badge" id="badgeCell"></span>
      <span class="badge badge-green" id="badgeTellus"></span>
      <span class="badge badge-green" id="badgeEPA"></span>
    </div>
  </div>

  <!-- RIGHT: REPORT -->
  <div class="report-pane" id="reportPane">
    <div class="empty-state" id="emptyState">Hover the map of Ireland to see the dose assessment.</div>
    <div id="reportContent" style="display:none"></div>
  </div>
</div>

<!-- CURSOR TRIANGLE -->
<div class="cursor-tri" id="cursorTri">
  <svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
    <polygon id="triFill" points="24,6 6,40 42,40" fill="#3b82f608" stroke="none"/>
    <line id="armRn" x1="24" y1="24" x2="24" y2="8" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
    <line id="armTn" x1="24" y1="24" x2="10" y2="38" stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/>
    <line id="armGm" x1="24" y1="24" x2="38" y2="38" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="24" cy="24" r="3" fill="#e6ebf5"/>
  </svg>
</div>

<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════════
// CONFIGURATION
// ═══════════════════════════════════════════════════════════════════════

const API_BASE = location.hostname === "localhost" || location.hostname === "127.0.0.1"
  ? "http://localhost:8000"
  : (new URLSearchParams(location.search).get("api") || "http://localhost:8000");

const IE = { minLat: 51.4, maxLat: 55.4, minLon: -10.6, maxLon: -5.3 };
const COLORS = { GREEN: "#22c55e", AMBER: "#f59e0b", RED: "#ef4444", INSUFFICIENT: "#8b97b0" };
const BING_KEY = ""; // Set via ?bing_key=... or leave empty

// ═══════════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════════

let lastDose = null;       // last successful API response
let isPinned = false;
let pinnedCoord = null;
let pendingAbort = null;
let debounceTimer = null;
let cursorOverMap = false;
let currentBasemap = "satellite";

// ═══════════════════════════════════════════════════════════════════════
// MAP SETUP
// ═══════════════════════════════════════════════════════════════════════

const map = new maplibregl.Map({
  container: "map",
  center: [-8.5, 53.3],
  zoom: 7,
  minZoom: 5,
  maxZoom: 18,
  maxBounds: [[-10.7, 51.3], [-5.2, 55.5]],
  style: {
    version: 8,
    sources: {
      "esri-imagery": { type: "raster", tiles: [
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"
      ], tileSize: 256, attribution: "Esri" },
      "osm-streets": { type: "raster", tiles: [
        "https://tile.openstreetmap.org/{z}/{x}/{y}.png"
      ], tileSize: 256, attribution: "OSM" },
    },
    layers: [
      { id: "layer-satellite", type: "raster", source: "esri-imagery" },
      { id: "layer-streets", type: "raster", source: "osm-streets", layout: { visibility: "none" } },
    ],
  },
});
map.addControl(new maplibregl.NavigationControl(), "top-right");

// Bing layer (only activates if key provided)
let bingEnabled = false;
function activateBing() {
  const key = BING_KEY || new URLSearchParams(location.search).get("bing_key");
  if (!key) {
    alert("Bing Maps key not configured. Set BING_MAPS_KEY or add ?bing_key=... to the URL.");
    return;
  }
  if (!bingEnabled) {
    map.addSource("bing-aerial", { type: "raster", tiles: [
      `https://ecn.t${Math.floor(Math.random()*4)+1}.tiles.virtualearth.net/tiles/a{q}.jpeg?g=587&key=${key}`
    ], tileSize: 256 });
    map.addLayer({ id: "layer-bing", type: "raster", source: "bing-aerial", layout: { visibility: "none" } });
    bingEnabled = true;
  }
}

// Basemap toggle
function setBasemap(which) {
  document.querySelectorAll(".basemap-toggle button").forEach(b => b.classList.remove("active"));
  map.setLayoutProperty("layer-satellite", "visibility", which === "satellite" ? "visible" : "none");
  map.setLayoutProperty("layer-streets", "visibility", which === "streets" ? "visible" : "none");
  if (bingEnabled) map.setLayoutProperty("layer-bing", "visibility", which === "bing" ? "visible" : "none");
  currentBasemap = which;
  document.getElementById(which === "satellite" ? "btnSat" : which === "bing" ? "btnBing" : "btnStreets").classList.add("active");
}
document.getElementById("btnSat").onclick = () => setBasemap("satellite");
document.getElementById("btnBing").onclick = () => { activateBing(); setBasemap("bing"); };
document.getElementById("btnStreets").onclick = () => setBasemap("streets");

// ═══════════════════════════════════════════════════════════════════════
// RISK CHOROPLETH OVERLAY (zoom < 10)
// ═══════════════════════════════════════════════════════════════════════

let choroplethLoaded = false;
let choroplethTimer = null;

function updateChoropleth() {
  if (map.getZoom() >= 10) {
    if (map.getLayer("choropleth-fill")) map.setLayoutProperty("choropleth-fill", "visibility", "none");
    return;
  }
  if (choroplethTimer) clearTimeout(choroplethTimer);
  choroplethTimer = setTimeout(fetchChoropleth, 500);
}

async function fetchChoropleth() {
  const b = map.getBounds();
  try {
    const resp = await fetch(`${API_BASE}/dose/bbox?lat_min=${b.getSouth()}&lat_max=${b.getNorth()}&lon_min=${b.getWest()}&lon_max=${b.getEast()}&step_km=5`);
    if (!resp.ok) return;
    const data = await resp.json();
    if (!data.grid || !data.grid.length) return;

    const features = data.grid.filter(d => d.risk && d.risk.tier !== "INSUFFICIENT DATA").map(d => ({
      type: "Feature",
      properties: { tier: d.risk.tier, dose: d.total_terrestrial_mSv_yr || 0 },
      geometry: {
        type: "Polygon",
        coordinates: [[
          [d.lon - 0.02, d.lat - 0.02],
          [d.lon + 0.02, d.lat - 0.02],
          [d.lon + 0.02, d.lat + 0.02],
          [d.lon - 0.02, d.lat + 0.02],
          [d.lon - 0.02, d.lat - 0.02],
        ]]
      }
    }));

    const geojson = { type: "FeatureCollection", features };

    if (map.getSource("choropleth")) {
      map.getSource("choropleth").setData(geojson);
    } else {
      map.addSource("choropleth", { type: "geojson", data: geojson });
      map.addLayer({
        id: "choropleth-fill", type: "fill", source: "choropleth",
        paint: {
          "fill-color": [
            "case",
            ["==", ["get", "tier"], "RED"], "rgba(239,68,68,0.30)",
            ["==", ["get", "tier"], "AMBER"], "rgba(245,158,11,0.25)",
            "rgba(34,197,94,0.25)"
          ],
          "fill-opacity": 1
        }
      });
    }
    if (map.getLayer("choropleth-fill")) map.setLayoutProperty("choropleth-fill", "visibility", "visible");
    choroplethLoaded = true;
  } catch (e) { /* silent: choropleth is optional overlay */ }
}

map.on("moveend", updateChoropleth);
map.on("zoomend", updateChoropleth);

// ═══════════════════════════════════════════════════════════════════════
// SEARCH
// ═══════════════════════════════════════════════════════════════════════

document.getElementById("searchInput").addEventListener("keydown", async (e) => {
  if (e.key !== "Enter") return;
  const q = e.target.value.trim();
  if (!q) return;
  const msg = document.getElementById("searchMsg");
  msg.textContent = "Searching\u2026";
  try {
    const resp = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q + ", Ireland")}&limit=1`);
    const data = await resp.json();
    if (!data || !data.length) { msg.textContent = "Location not found"; return; }
    const lat = parseFloat(data[0].lat), lon = parseFloat(data[0].lon);
    if (lat < IE.minLat || lat > IE.maxLat || lon < IE.minLon || lon > IE.maxLon) {
      msg.textContent = "Location not in Ireland"; return;
    }
    msg.textContent = data[0].display_name || "";
    map.flyTo({ center: [lon, lat], zoom: 13, essential: true });
    setTimeout(() => queryDose(lat, lon), 800);
  } catch (err) { msg.textContent = "Search failed"; }
});

// ═══════════════════════════════════════════════════════════════════════
// CURSOR TRIANGLE
// ═══════════════════════════════════════════════════════════════════════

const cursorTri = document.getElementById("cursorTri");
const armRn = document.getElementById("armRn");
const armTn = document.getElementById("armTn");
const armGm = document.getElementById("armGm");
const triFill = document.getElementById("triFill");
const cx = 24, cy = 24, MAX_ARM = 18;

function updateTriangleArms(d) {
  if (!d || !d.arms_mSv_yr) return;
  const vals = {
    rn: d.arms_mSv_yr.radon || 0,
    tn: d.arms_mSv_yr.thoron || 0,
    gm: d.arms_mSv_yr.gamma || 0,
  };
  const maxV = Math.max(vals.rn, vals.tn, vals.gm, 0.001);
  const scale = MAX_ARM / maxV;

  const rnLen = vals.rn * scale;
  const tnLen = vals.tn * scale;
  const gmLen = vals.gm * scale;

  // Arm 1 (up, 270deg): radon
  const rnX = cx + rnLen * Math.cos(-Math.PI / 2);
  const rnY = cy + rnLen * Math.sin(-Math.PI / 2);
  armRn.setAttribute("x2", rnX); armRn.setAttribute("y2", rnY);

  // Arm 2 (lower-left, 150deg): thoron
  const tnX = cx + tnLen * Math.cos(150 * Math.PI / 180);
  const tnY = cy + tnLen * Math.sin(150 * Math.PI / 180);
  armTn.setAttribute("x2", tnX); armTn.setAttribute("y2", tnY);

  // Arm 3 (lower-right, 30deg): gamma
  const gmX = cx + gmLen * Math.cos(30 * Math.PI / 180);
  const gmY = cy + gmLen * Math.sin(30 * Math.PI / 180);
  armGm.setAttribute("x2", gmX); armGm.setAttribute("y2", gmY);

  triFill.setAttribute("points", `${rnX},${rnY} ${tnX},${tnY} ${gmX},${gmY}`);
}

// ═══════════════════════════════════════════════════════════════════════
// MAP INTERACTION: hover + click-to-pin
// ═══════════════════════════════════════════════════════════════════════

const mapEl = document.getElementById("map");
mapEl.addEventListener("mousemove", (e) => {
  cursorOverMap = true;
  cursorTri.style.left = (e.clientX - 24) + "px";
  cursorTri.style.top = (e.clientY - 24) + "px";
  cursorTri.classList.add("visible");

  if (isPinned) return;

  if (debounceTimer) clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => {
    const coord = map.unproject([e.clientX - mapEl.getBoundingClientRect().left, e.clientY - mapEl.getBoundingClientRect().top]);
    if (coord.lat >= IE.minLat && coord.lat <= IE.maxLat && coord.lng >= IE.minLon && coord.lng <= IE.maxLon) {
      queryDose(coord.lat, coord.lng);
    }
  }, 100);
});

mapEl.addEventListener("mouseleave", () => {
  cursorOverMap = false;
  cursorTri.classList.remove("visible");
});

// Click-to-pin
map.on("click", (e) => {
  if (isPinned) {
    isPinned = false;
    pinnedCoord = null;
    document.getElementById("pinOverlay").style.display = "none";
  } else {
    isPinned = true;
    pinnedCoord = { lat: e.lngLat.lat, lon: e.lngLat.lng };
    document.getElementById("pinOverlay").style.display = "block";
  }
});

// ═══════════════════════════════════════════════════════════════════════
// API QUERY
// ═══════════════════════════════════════════════════════════════════════

async function queryDose(lat, lon) {
  if (pendingAbort) pendingAbort.abort();
  pendingAbort = new AbortController();

  try {
    const resp = await fetch(`${API_BASE}/dose?lat=${lat}&lon=${lon}`, { signal: pendingAbort.signal });
    if (!resp.ok) {
      const err = await resp.json().catch(() => ({ detail: resp.statusText }));
      showError(err.detail || err.error || "API error");
      return;
    }
    const data = await resp.json();
    lastDose = data;
    updateTriangleArms(data);
    renderReport(data);
    updateBadges(data);
  } catch (e) {
    if (e.name !== "AbortError") showError(e.message);
  }
}

// ═══════════════════════════════════════════════════════════════════════
// BADGES (bottom-left)
// ═══════════════════════════════════════════════════════════════════════

function updateBadges(d) {
  const cell = document.getElementById("badgeCell");
  const tellus = document.getElementById("badgeTellus");
  const epa = document.getElementById("badgeEPA");

  cell.textContent = d.cell_m ? `Cell: ${d.cell_m}m` : "";
  cell.style.display = d.cell_m ? "" : "none";

  tellus.textContent = d.tellus_available ? "\u2713 Tellus" : "";
  tellus.style.display = d.tellus_available ? "" : "none";

  epa.textContent = d.epa_radon_available ? "\u2713 EPA radon" : "";
  epa.style.display = d.epa_radon_available ? "" : "none";
}

// ═══════════════════════════════════════════════════════════════════════
// ERROR STATE
// ═══════════════════════════════════════════════════════════════════════

function showError(msg) {
  document.getElementById("emptyState").style.display = "none";
  const rc = document.getElementById("reportContent");
  rc.style.display = "block";
  // Preserve existing report if any, add error banner at top
  let banner = document.getElementById("errorBanner");
  if (!banner) {
    banner = document.createElement("div");
    banner.id = "errorBanner";
    banner.className = "error-banner";
    rc.prepend(banner);
  }
  banner.textContent = `Data unavailable: ${msg}`;
  banner.style.display = "block";
}

// ═══════════════════════════════════════════════════════════════════════
// REPORT PANEL RENDER
// ═══════════════════════════════════════════════════════════════════════

function renderReport(d) {
  document.getElementById("emptyState").style.display = "none";
  const rc = document.getElementById("reportContent");
  rc.style.display = "block";

  // Remove stale error
  const eb = document.getElementById("errorBanner");
  if (eb) eb.remove();

  // Water body state
  if (d.is_water) {
    rc.innerHTML = `<div class="water-banner">Water body &mdash; no terrestrial dose assessment</div>`;
    return;
  }

  const tier = d.risk?.tier || "INSUFFICIENT";
  const tierColor = COLORS[tier] || COLORS.INSUFFICIENT;

  // ── Build fingerprint triangle SVG ──
  const arms = d.arms_mSv_yr || {};
  const rnV = arms.radon || 0;
  const tnV = arms.thoron || 0;
  const gmV = arms.gamma || 0;
  const maxV = Math.max(rnV, tnV, gmV, 0.001);
  const s = 85 / maxV;
  const fcx = 100, fcy = 100;

  const rnX = fcx, rnY = fcy - rnV * s;
  const tnX = fcx - tnV * s * Math.cos(Math.PI / 6), tnY = fcy + tnV * s * 0.5;
  const gmX = fcx + gmV * s * Math.cos(Math.PI / 6), gmY = fcy + gmV * s * 0.5;

  const fprintSVG = `<svg width="200" height="200" viewBox="0 0 200 200" style="display:block;margin:0 auto 8px">
    <polygon points="${rnX},${rnY} ${tnX},${tnY} ${gmX},${gmY}" fill="#3b82f608" stroke="#243049" stroke-width="0.5"/>
    <line x1="${fcx}" y1="${fcy}" x2="${rnX}" y2="${rnY}" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="${fcx}" y1="${fcy}" x2="${tnX}" y2="${tnY}" stroke="#f97316" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="${fcx}" y1="${fcy}" x2="${gmX}" y2="${gmY}" stroke="#22c55e" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="${fcx}" cy="${fcy}" r="3" fill="#e6ebf5"/>
    <text x="${rnX}" y="${rnY - 6}" text-anchor="middle" fill="#3b82f6" font-size="10" font-weight="600">Radon ${rnV !== null ? rnV.toFixed(3) : "N/A"}</text>
    <text x="${tnX - 4}" y="${tnY + 14}" text-anchor="end" fill="#f97316" font-size="10" font-weight="600">Thoron ${tnV !== null ? tnV.toFixed(3) : "N/A"}</text>
    <text x="${gmX + 4}" y="${gmY + 14}" text-anchor="start" fill="#22c55e" font-size="10" font-weight="600">Gamma ${gmV !== null ? gmV.toFixed(3) : "N/A"}</text>
  </svg>`;

  // ── Why this dose? bullets ──
  const whyLines = [];
  const total = d.total_terrestrial_mSv_yr || 0;
  if (total > 0) {
    if (rnV > 0) {
      const pct = (rnV / total * 100).toFixed(0);
      whyLines.push({ text: `Radon is ${pct}% of total dose (${rnV.toFixed(3)} mSv/yr)`, dot: "amber" });
    }
    if (gmV > 0) {
      const pct = (gmV / total * 100).toFixed(0);
      whyLines.push({ text: `Gamma contributes ${pct}% (${gmV.toFixed(3)} mSv/yr)`, dot: "blue" });
    }
    if (tnV > 0) {
      const pct = (tnV / total * 100).toFixed(0);
      whyLines.push({ text: `Thoron contributes ${pct}% (${tnV.toFixed(3)} mSv/yr)`, dot: "amber" });
    }
  }
  if (d.report_short) {
    d.report_short.forEach(line => {
      if (line.includes("EXCEEDS") || line.includes("Missing") || line.includes("No direct"))
        whyLines.push({ text: line, dot: "amber" });
      else if (line.includes("below") || line.includes("All dose"))
        whyLines.push({ text: line, dot: "green" });
      else
        whyLines.push({ text: line, dot: "blue" });
    });
  }

  // ── Factors table ──
  let factorsHTML = "";
  if (d.factors) {
    d.factors.forEach(f => {
      const val = f.value === null || f.value === undefined ? "No data" :
                  f.value === "no data" ? "No data available for this layer" :
                  typeof f.value === "number" ? f.value.toLocaleString() : f.value;
      const dirClass = f.direction === "up" ? "dir-up" : f.direction === "down" ? "dir-down" : f.direction === "varies" ? "dir-varies" : "dir-neutral";
      const dirArrow = f.direction === "up" ? "\u2191" : f.direction === "down" ? "\u2193" : f.direction === "varies" ? "\u2194" : "\u2192";
      const noDataStyle = val === "No data" || val === "No data available for this layer" ? "color:#8b97b0;font-style:italic" : "";
      factorsHTML += `<div class="factor-row">
        <span class="factor-name">${f.name}</span>
        <span class="factor-value" style="${noDataStyle}">${val} ${f.unit ? `<span style="color:#8b97b0">${f.unit}</span>` : ""}</span>
        <span class="factor-dir ${dirClass}">${dirArrow}</span>
      </div>`;
    });
  }

  // ── Confidence ──
  const conf = d.confidence || {};
  const confColor = conf.score >= 75 ? "#22c55e" : conf.score >= 40 ? "#f59e0b" : "#ef4444";

  // ── Source badges ──
  let srcBadges = "";
  if (d.tellus_available) srcBadges += `<span class="source-badge">\u2713 Tellus measured K/U/Th</span>`;
  if (d.epa_radon_available) srcBadges += `<span class="source-badge">\u2713 EPA radon map</span>`;

  // ── Provenance footer ──
  const provLines = [
    "Standards: UNSCEAR 2000 (dose coefficients), UNSCEAR 2006 (radon DCC), ICRP 103 (occupancy)",
    "Irish action level: 200 Bq/m\u00b3 (Building Regulations 1997, SI 496)",
    "EU BSS 2013/59/Euratom reference"
  ];
  if (d.provenance) {
    d.provenance.forEach(p => provLines.push(p));
  }

  // ── Derivation strings ──
  let derivHTML = "";
  if (d.derivation && Object.keys(d.derivation).length > 0) {
    derivHTML = `<div style="margin-top:10px"><strong style="color:#3b82f6;font-size:10px">Derivations:</strong>`;
    Object.entries(d.derivation).forEach(([k, v]) => {
      derivHTML += `<div style="font-size:10px;color:#8b97b0;margin-left:4px">${k}: ${v}</div>`;
    });
    derivHTML += `</div>`;
  }

  // ── Assemble ──
  const pinned = isPinned ? `<div style="color:#f59e0b;font-size:11px;margin-bottom:6px">📌 Pinned &mdash; click map to unpin</div>` : "";

  rc.innerHTML = `
    ${pinned}
    <div class="loc-header">${d.lat.toFixed(4)}&deg; N, ${d.lon.toFixed(4)}&deg; W &middot; Cell ${d.cell_m}m</div>

    <div class="card updating" id="riskCard">
      <span class="risk-pill risk-${tier}">${tier === "INSUFFICIENT DATA" ? "INSUFFICIENT DATA" : tier + " &mdash; " + (d.risk?.label || "")}</span>
      ${d.total_terrestrial_mSv_yr !== null ? `<span style="font-size:16px;font-weight:700;color:${tierColor}">${d.total_terrestrial_mSv_yr.toFixed(3)} mSv/yr</span>` : `<span style="color:#8b97b0">No total computed</span>`}
    </div>

    <div class="card">
      <h2>Dose Fingerprint</h2>
      ${d.total_terrestrial_mSv_yr !== null ? fprintSVG : `<div style="text-align:center;color:#8b97b0;padding:20px">No dose data available</div>`}
      <div class="dose-row"><div class="dose-swatch" style="background:#3b82f6"></div><span class="dose-label">Radon</span><span class="dose-value">${arms.radon !== null ? arms.radon.toFixed(3) + " mSv/yr" : "No data"}</span></div>
      <div class="dose-row"><div class="dose-swatch" style="background:#f97316"></div><span class="dose-label">Thoron</span><span class="dose-value">${arms.thoron !== null ? arms.thoron.toFixed(3) + " mSv/yr" : "No data"}</span></div>
      <div class="dose-row"><div class="dose-swatch" style="background:#22c55e"></div><span class="dose-label">Gamma</span><span class="dose-value">${arms.gamma !== null ? arms.gamma.toFixed(3) + " mSv/yr" : "No data"}</span></div>
      <div class="dose-row dose-total"><span class="dose-label">Total</span><span class="dose-value" style="color:${tierColor}">${d.total_terrestrial_mSv_yr !== null ? d.total_terrestrial_mSv_yr.toFixed(3) + " mSv/yr" : "No data"}</span></div>
    </div>

    <div class="card">
      <h2>Why this dose?</h2>
      ${whyLines.length ? whyLines.map(l => `<div style="font-size:11px;line-height:1.6;margin-bottom:3px"><span class="why-dot dot-${l.dot}"></span>${l.text}</div>`).join("") : `<div style="color:#8b97b0;font-size:11px">Insufficient data to explain</div>`}
    </div>

    <div class="card">
      <h2>Factors at this point</h2>
      ${factorsHTML || `<div style="color:#8b97b0;font-size:11px">No factors available</div>`}
    </div>

    <div class="card">
      <h2>Confidence</h2>
      <div class="conf-bar"><div class="conf-fill" style="width:${conf.score || 0}%;background:${confColor}"></div></div>
      <div class="conf-text">${conf.level || "unknown"} (${conf.score || 0}%) &mdash; ${conf.reason || "no data"}</div>
    </div>

    ${srcBadges ? `<div class="card" style="padding:8px 12px">${srcBadges}</div>` : ""}

    <div class="card provenance">
      ${provLines.map(l => `<div>${l}</div>`).join("")}
      ${derivHTML}
      ${d.missing_layers && d.missing_layers.length ? `<div style="margin-top:6px;color:#f59e0b">Missing layers: ${d.missing_layers.join(", ")}</div>` : ""}
    </div>
  `;
}

// ═══════════════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════════════

// Check backend health on load
fetch(`${API_BASE}/health`).then(r => r.json()).then(h => {
  const loaded = Object.values(h.layers_loaded || {}).filter(Boolean).length;
  const total = Object.keys(h.layers_loaded || {}).length;
  document.getElementById("searchMsg").textContent = `Backend: ${loaded}/${total} layers loaded`;
  setTimeout(() => { document.getElementById("searchMsg").textContent = ""; }, 4000);
}).catch(() => {
  document.getElementById("searchMsg").textContent = `Backend not reachable at ${API_BASE}`;
});

</script>
</body>
</html>
