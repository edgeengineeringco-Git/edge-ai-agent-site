<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Irish Terrestrial Dose Indicator</title>
<link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#0a0e1a;color:#e6ebf5;font-family:Inter,-apple-system,sans-serif;font-size:13px}
.app{display:flex;flex-direction:column;width:100%;height:100%}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:0 16px;height:48px;background:rgba(10,14,26,0.92);border-bottom:1px solid #243049;backdrop-filter:blur(12px);z-index:10}
.topbar-brand{display:flex;align-items:center;gap:10px}
.topbar-logo{color:#22c55e;font-size:18px}
.topbar-title{font-size:15px;font-weight:700;letter-spacing:0.3px}
.topbar-subtitle{font-size:11px;opacity:0.5;font-weight:400;margin-left:8px}
.topbar-controls{display:flex;align-items:center;gap:8px}
.search-box{display:flex;align-items:center;background:rgba(255,255,255,0.06);border:1px solid #243049;border-radius:6px;padding:0 8px;height:30px}
.search-box input{background:transparent;border:none;color:#e6ebf5;font-size:12px;outline:none;width:160px;font-family:Inter,sans-serif}
.search-box input::placeholder{color:rgba(255,255,255,0.3)}
.search-box button{background:transparent;border:none;color:rgba(255,255,255,0.5);cursor:pointer;display:flex;align-items:center;padding:2px}
.preset-select{background:rgba(255,255,255,0.06);border:1px solid #243049;color:#e6ebf5;font-size:12px;padding:0 8px;height:30px;border-radius:6px;outline:none;cursor:pointer;font-family:Inter,sans-serif}
.data-badges{display:flex;gap:6px;margin-left:12px}
.data-badge{font-size:10px;padding:2px 8px;border-radius:4px;background:rgba(34,197,94,0.15);color:#22c55e;border:1px solid rgba(34,197,94,0.3)}
.data-badge.inactive{background:rgba(255,255,255,0.04);color:#8b97b0;border-color:#243049}
.main{display:flex;flex:1;overflow:hidden;position:relative}
.map-pane{flex:0.6;position:relative;min-width:0}
.map-canvas{width:100%;height:100%}
.floating-triangle{position:absolute;pointer-events:none;transform:translate(-50%,-50%);z-index:5;transition:left 0.15s ease,top 0.15s ease}
.triangle-tooltip{background:rgba(10,14,26,0.92);border:1px solid;border-radius:6px;padding:6px 10px;text-align:center;margin-top:4px;backdrop-filter:blur(6px)}
.triangle-total{font-size:14px;font-weight:700;font-family:'JetBrains Mono',monospace}
.triangle-tier{display:inline-block;color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:4px;margin-top:4px;letter-spacing:0.5px}
.map-statusbar{position:absolute;bottom:0;left:0;right:0;height:24px;background:rgba(10,14,26,0.7);display:flex;align-items:center;padding:0 12px;font-size:10px;opacity:0.6;z-index:5;pointer-events:none;font-family:'JetBrains Mono',monospace}
.map-loader{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a0e1a;z-index:8;gap:12px}
.loader-spinner{width:28px;height:28px;border:2px solid #243049;border-top-color:#22c55e;border-radius:50%;animation:spin 0.8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.panel-pane{width:40%;min-width:340px;background:#111726;border-left:1px solid #243049;overflow-y:auto;z-index:20}
.panel{padding:20px}
.panel-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.panel-title{font-size:19px;font-weight:700;color:#e6ebf5}
.panel-subtitle{font-size:11px;color:#8b97b0;margin-top:2px}
.risk-badge{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:8px;border:1px solid;margin-bottom:16px}
.risk-tier{color:#fff;font-size:11px;font-weight:700;padding:3px 10px;border-radius:4px;letter-spacing:0.5px}
.risk-total{font-size:20px;font-weight:700;font-family:'JetBrains Mono',monospace}
.risk-vs{font-size:11px;color:#8b97b0;margin-left:auto}
.triangle-section{display:flex;justify-content:center;margin-bottom:16px}
.dose-bars{margin-bottom:16px}
.dose-bar-row{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.dose-bar-label{width:50px;font-size:11px;color:#8b97b0}
.dose-bar-track{flex:1;height:5px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden}
.dose-bar-fill{height:100%;border-radius:3px;transition:width 0.2s ease}
.dose-bar-value{width:50px;text-align:right;font-size:12px;font-weight:600;font-family:'JetBrains Mono',monospace}
.section{margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid #243049}
.section:last-child{border-bottom:none}
.section-title{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:#8b97b0;margin-bottom:8px;font-weight:600}
.report-line{font-size:12px;line-height:1.6;color:#e6ebf5;margin-bottom:4px}
.factors-table{width:100%;border-collapse:collapse}
.factors-table th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:0.5px;color:#8b97b0;padding:4px 6px;border-bottom:1px solid #243049;font-weight:600}
.factors-table td{font-size:11px;padding:4px 6px;border-bottom:1px solid rgba(36,48,73,0.5);color:#e6ebf5}
.factors-table .dir-up{color:#f59e0b}
.factors-table .dir-down{color:#22c55e}
.factors-table .dir-neutral{color:#8b97b0}
.confidence-meter{margin-bottom:6px}
.confidence-track{height:5px;background:rgba(255,255,255,0.06);border-radius:3px;overflow:hidden}
.confidence-fill{height:100%;border-radius:3px;transition:width 0.3s ease}
.confidence-labels{display:flex;justify-content:space-between;font-size:10px;color:#8b97b0;margin-top:3px}
.confidence-score{font-weight:700}
.confidence-note{font-size:11px;color:#8b97b0;line-height:1.4;margin-top:4px}
.provenance{font-size:10px;color:#8b97b0;line-height:1.5}
.provenance-item{margin-bottom:2px}
.provenance-item::before{content:"→ ";color:#22c55e}
.panel-empty{display:flex;align-items:center;justify-content:center;height:100%;text-align:center;padding:40px}
.panel-hint{color:#8b97b0}
.panel-hint svg{margin-bottom:12px;opacity:0.4}
.panel-hint p{font-size:13px;margin-bottom:4px}
.panel-hint-sub{font-size:11px;opacity:0.6;margin-top:8px}
.std-row{display:flex;align-items:center;gap:8px;font-size:11px;margin-bottom:4px;color:#e6ebf5}
.std-dot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.std-dot.green{background:#22c55e}
.std-dot.amber{background:#f59e0b}
.std-dot.red{background:#ef4444}
.residual-row{display:flex;justify-content:space-between;font-size:11px;padding:3px 0;color:#e6ebf5}
.residual-label{color:#8b97b0}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="topbar-brand">
      <span class="topbar-logo">◈</span>
      <h1 class="topbar-title">Irish-Dose</h1>
      <span class="topbar-subtitle">Terrestrial Radiation Dose Indicator</span>
    </div>
    <div class="topbar-controls">
      <div class="data-badges" id="dataBadges">
        <span class="data-badge inactive" id="badgeTellus">Tellus</span>
        <span class="data-badge inactive" id="badgeEpa">EPA Rn</span>
      </div>
      <div class="search-box">
        <input id="searchInput" type="text" placeholder="Search town or Eircode…">
        <button id="searchBtn"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg></button>
      </div>
      <select id="presetSelect" class="preset-select">
        <option value="" disabled selected>Jump to…</option>
        <option value="53.3498,-6.2603">Dublin</option>
        <option value="51.8985,-8.4756">Cork</option>
        <option value="53.2707,-9.0568">Galway</option>
        <option value="52.6638,-8.6267">Limerick</option>
        <option value="54.5973,-5.9301">Belfast</option>
        <option value="52.98,-6.35">Wicklow Granite</option>
        <option value="53.05,-9.15">Burren Limestone</option>
        <option value="53.35,-9.55">Connemara</option>
        <option value="54.95,-8.0">Donegal Granite</option>
        <option value="52.06,-9.55">Kerry</option>
      </select>
    </div>
  </header>
  <main class="main">
    <div class="map-pane">
      <div id="map" class="map-canvas"></div>
      <div id="triangle" class="floating-triangle" style="display:none"></div>
      <div class="map-statusbar"><span id="statusCoords">Hover the map of Ireland</span><span id="statusCell" style="margin-left:auto">Cell: 100m</span></div>
    </div>
    <div id="panelPane" class="panel-pane">
      <div id="panelContent">
        <div class="panel-empty">
          <div class="panel-hint">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3"/></svg>
            <p>Click anywhere on the map</p>
            <p class="panel-hint-sub">Hover to see the live dose triangle</p>
            <p class="panel-hint-sub">Ireland only · 100m resolution</p>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<script>
// ═════════════════════════════════════════════════════════════════════════════
// DOSE CALCULATION CORE — SINGLE SOURCE OF TRUTH (JS port of dose_calculation_core.py)
// ═════════════════════════════════════════════════════════════════════════════

const DCC_RA=0.462,DCC_TH=0.604,DCC_K=0.041,HOURS=8760,CC=0.7;
const EU_TO_RA=12.22,ETH_TO_TH=4.06,K_TO_K40=313.0;
const IRISH_RN_ACTION=200,RADON_IRISH_FACTOR=6.7/200.0;

const LA={
  Pa:[60,80,1200],Pi:[30,40,800],Pb:[12,18,300],Vb:[15,20,350],
  Vi:[25,35,700],Va:[50,70,1100],Mt:[45,55,850],Py:[40,45,700],
  Ss:[35,35,400],Sm:[35,40,500],Sc:[20,12,90],Sb:[25,30,600],
  Ev:[12,8,120],Su:[30,35,450],Wa:[0,0,0],Ice:[0,0,0],
  granite:[60,80,1200],limestone:[20,12,90],sandstone:[35,35,400],
  shale:[40,50,700],mudstone:[35,45,650],siltstone:[30,38,500],
  schist:[40,45,700],gneiss:[45,55,850],slate:[40,48,680],
  quartzite:[25,28,350],marble:[15,10,90],dolomite:[18,10,80],
  chalk:[15,8,70],basalt:[15,20,350],gabbro:[12,18,300],
  alluvium:[30,35,450],world_average_soil:[35,30,420],
  monazite_bearing:[100,800,300],carbonatite:[500,400,800],
};
const GLIM_NAMES={
  Pa:"acid plutonic (granite)",Pi:"intermediate plutonic",Pb:"basic plutonic",
  Vb:"basic volcanic",Vi:"intermediate volcanic",Va:"acid volcanic",
  Mt:"metamorphic",Py:"pyroclastic",Ss:"siliciclastic sedimentary",
  Sm:"mixed sedimentary",Sc:"carbonate sedimentary",Sb:"basic pyroclastic",
  Ev:"evaporite",Su:"unconsolidated sediments",Wa:"water",Ice:"ice",
};
const LF={
  Pa:1.3,Pi:1.0,Pb:0.6,Vb:0.7,Vi:0.9,Va:1.2,Mt:1.2,Py:1.1,
  Ss:1.4,Sm:1.2,Sc:0.7,Sb:1.0,Ev:0.4,Su:1.5,Wa:0,Ice:0,
  granite:1.3,limestone:0.7,sandstone:1.4,shale:0.8,mudstone:0.8,
  siltstone:1.0,schist:1.1,gneiss:1.2,slate:0.8,quartzite:1.0,
  marble:0.6,dolomite:0.7,chalk:0.6,basalt:0.7,gabbro:0.6,
  alluvium:1.5,world_average_soil:1.0,monazite_bearing:2.0,carbonatite:1.8,
};

function lithActs(l){return LA[l]||LA.world_average_soil}
function lithFact(l){return LF[l]??1.0}
function glimName(l){return GLIM_NAMES[l]||l}
function gammaRate(a,b,c){return DCC_RA*a+DCC_TH*b+DCC_K*c}
function annualGamma(a,b,c){return gammaRate(a,b,c)*HOURS*0.8*CC*1e-6}
function rnDoseIrish(c){return c*RADON_IRISH_FACTOR}
function rnDoseEUSS(c){return c*(10/300)}
function grPotential(ra,perm,df,lin,lf){return(ra/50)*Math.sqrt(perm/1e-13)*(1+0.3*Math.max(0,1-df/2000))*(1+0.2*Math.min(1,lin/2))*lf}
function gtPotential(th,lf){return th*0.3*2.0*lf}
function tnDose(gtp){return gtp*0.02*40*7000*1e-6}
function raeq(a,b,c){return a+1.43*b+0.077*c}

function doseFingerprint(o){
  const lith=o.lithology||"world_average_soil";
  const prior=lithActs(lith);const lf=lithFact(lith);
  let A_Ra=prior[0],A_Th=prior[1],A_K=prior[2];
  const prov=[];
  if(o.eU_ppm!=null){A_Ra=o.eU_ppm*EU_TO_RA;prov.push("A_Ra226: measured")}
  if(o.eTh_ppm!=null){A_Th=o.eTh_ppm*ETH_TO_TH;prov.push("A_Th232: measured")}
  if(o.K_pct!=null){A_K=o.K_pct*K_TO_K40;prov.push("A_K40: measured")}
  const gr=gammaRate(A_Ra,A_Th,A_K),eG=annualGamma(A_Ra,A_Th,A_K);
  let C_Rn=o.C_Rn;
  if(C_Rn==null){const grp=grPotential(A_Ra,o.permeability||1e-13,o.dist_fault||1000,o.lineament||0.5,lf);C_Rn=grp*50;prov.push("radon: GRP")}
  else{prov.push("radon: measured")}
  const eRn=rnDoseIrish(C_Rn);
  const gtp=gtPotential(A_Th,lf),eTn=tnDose(gtp);
  const raeqV=raeq(A_Ra,A_Th,A_K),eTotal=eG+eRn+eTn;
  let tier;const flags=[];
  if(eTotal<=2.2)tier="GREEN";else if(eTotal<=6.6)tier="AMBER";else tier="RED";
  if(C_Rn>=200){flags.push("RADON_ACTION: "+C_Rn.toFixed(0)+">=Irish 200");tier="RED"}
  else if(C_Rn>=100){flags.push("RADON_ELEVATED: "+C_Rn.toFixed(0)+">=WHO 100");if(tier==="GREEN")tier="AMBER"}
  if(raeqV>=370){flags.push("RAEQ_HIGH: "+raeqV.toFixed(0)+">=370");if(tier!=="RED")tier="RED"}
  if(gr>=1000){flags.push("GAMMA_HIGH: "+gr.toFixed(0)+">=1000");tier="RED"}
  const conf=o.eU_ppm!=null?90:o.eTh_ppm!=null?75:o.K_pct!=null?60:20;
  return{arms:{radon:eRn,thoron:eTn,gamma:eG},total:eTotal,gr,raeq:raeqV,C_Rn,
    activities:{Ra:A_Ra,Th:A_Th,K:A_K},risk:{tier,flags},prov,conf,lith:lith,lithName:glimName(lith)};
}


// ═════════════════════════════════════════════════════════════════════════════
// IRELAND DATA LAYERS
// ═════════════════════════════════════════════════════════════════════════════

const GEOLOGY=[
  {n:"Leinster Granite",c:"Pa",d:"Caledonian Leinster Granite batholith",a:"Silurian",b:[-6.6,52.7,-6.0,53.1]},
  {n:"Dublin Basin",c:"Sc",d:"Carboniferous limestone basin",a:"Carboniferous",b:[-6.6,53.1,-6.0,53.5]},
  {n:"Kildare Inlier",c:"Pi",d:"Caledonian granodiorite",a:"Silurian",b:[-7.0,52.9,-6.5,53.2]},
  {n:"Wexford Ordovician",c:"Ss",d:"Ordovician sandstone",a:"Ordovician",b:[-6.8,52.1,-6.0,52.5]},
  {n:"Cork-Kerry ORS",c:"Ss",d:"Old Red Sandstone",a:"Devonian",b:[-10.0,51.4,-8.5,52.0]},
  {n:"Kerry Slates",c:"Sm",d:"Devonian mixed sedimentary",a:"Devonian",b:[-10.5,51.7,-9.5,52.3]},
  {n:"Beara Volcanics",c:"Vi",d:"Devonian intermediate volcanic",a:"Devonian",b:[-10.2,51.5,-9.5,51.9]},
  {n:"Dingle ORS",c:"Ss",d:"Old Red Sandstone",a:"Devonian",b:[-10.6,51.9,-9.8,52.3]},
  {n:"Connemara Metamorphic",c:"Mt",d:"Dalradian metamorphic rocks",a:"Precambrian",b:[-10.3,53.2,-9.5,53.6]},
  {n:"Galway Granite",c:"Pa",d:"Caledonian Galway Granite",a:"Devonian",b:[-10.2,53.0,-9.5,53.5]},
  {n:"Burren Limestone",c:"Sc",d:"Carboniferous limestone pavements",a:"Carboniferous",b:[-9.4,52.9,-8.8,53.2]},
  {n:"Mayo Metasediments",c:"Mt",d:"Dalradian metasediments",a:"Precambrian",b:[-10.0,53.5,-9.0,54.2]},
  {n:"Donegal Granite",c:"Pa",d:"Caledonian Donegal Granite",a:"Silurian",b:[-8.4,54.6,-7.6,55.3]},
  {n:"Donegal Metasediments",c:"Mt",d:"Dalradian metamorphic rocks",a:"Precambrian",b:[-8.5,54.5,-7.5,55.3]},
  {n:"Ulster Basalt",c:"Vb",d:"Tertiary basalt lava flows",a:"Tertiary",b:[-7.0,54.5,-5.5,55.3]},
  {n:"Mourne Granite",c:"Pa",d:"Tertiary Mourne Granite",a:"Tertiary",b:[-6.2,54.0,-5.8,54.3]},
  {n:"Midlands Limestone",c:"Sc",d:"Carboniferous limestone lowlands",a:"Carboniferous",b:[-8.5,52.5,-6.5,54.0]},
  {n:"Longford-Down Inlier",c:"Mt",d:"Lower Palaeozoic metasediments",a:"Ordovician",b:[-8.0,53.5,-6.0,54.5]},
  {n:"Slieve Bloom",c:"Ss",d:"Old Red Sandstone uplands",a:"Devonian",b:[-7.8,52.9,-7.3,53.2]},
  {n:"Clare Shales",c:"Sm",d:"Carboniferous shale",a:"Carboniferous",b:[-9.8,52.5,-8.8,53.0]},
  {n:"Lough Gill Granite",c:"Pa",d:"Caledonian granite",a:"Silurian",b:[-8.6,54.1,-8.1,54.4]},
  {n:"Ox Mountains",c:"Mt",d:"Precambrian metamorphic inlier",a:"Precambrian",b:[-9.2,53.9,-8.5,54.3]},
];

const TELLUS=[
  {b:[-7.5,52.8,-6.0,53.3],K:3.8,U:4.5,Th:18.2,mag:120},
  {b:[-8.0,54.0,-6.0,55.4],K:1.2,U:1.5,Th:5.8,mag:-30},
  {b:[-9.5,53.5,-7.5,54.5],K:0.8,U:1.0,Th:3.5,mag:5},
];

const EPA_RN=[
  {b:[-7.0,52.8,-6.0,53.3],r:"high",v:245},
  {b:[-8.5,54.3,-7.5,55.3],r:"high",v:280},
  {b:[-8.0,52.5,-6.5,53.5],r:"medium",v:120},
  {b:[-10.0,53.0,-8.5,53.5],r:"low",v:35},
  {b:[-9.5,52.9,-8.8,53.2],r:"low",v:35},
];

const TEAGASC=[
  {b:[-7.5,52.8,-6.0,53.3],cl:"acid brown earth",perm:1.2e-13,dr:"well-drained",br:1.5},
  {b:[-9.5,52.9,-8.8,53.2],cl:"rendzina",perm:2.5e-13,dr:"excessively drained",br:0.3},
  {b:[-10.0,53.2,-9.5,53.6],cl:"blanket peat",perm:0.3e-13,dr:"poorly drained",br:2.0},
  {b:[-8.5,52.5,-6.5,54.0],cl:"grey brown podzolic",perm:1.0e-13,dr:"moderately drained",br:1.2},
];

const FAULTS=[
  {n:"Wicklow Boundary Fault",t:"normal",c:[-6.3,52.9,-6.1,53.1]},
  {n:"Connemara Boundary Fault",t:"thrust",c:[-9.8,53.3,-9.5,53.5]},
  {n:"Leannan Fault",t:"strike-slip",c:[-8.0,54.8,-7.5,55.2]},
];

function inBox(lat,lon,b){return lat>=b[1]&&lat<=b[3]&&lon>=b[0]&&lon<=b[2]}
function distFault(lat,lon,f){
  const fl=(f.c[0]+f.c[2])/2,fa=(f.c[1]+f.c[3])/2;
  return Math.sqrt(((lat-fa)*111000)**2+((lon-fl)*66600)**2);
}

function sampleAt(lat,lon){
  if(lat<51.4||lat>55.4||lon<-10.6||lon>-5.3)return null;
  let lith="Su",lithDesc="unconsolidated deposits",lithAge="Quaternary";
  for(const g of GEOLOGY)if(inBox(lat,lon,g.b)){lith=g.c;lithDesc=g.d;lithAge=g.a;break}
  let K=null,U=null,Th=null,mag=null,tellusLabel=null;
  for(const t of TELLUS)if(inBox(lat,lon,t.b)){K=t.K;U=t.U;Th=t.Th;mag=t.mag;break}
  let rnRisk=null,rnEst=null;
  for(const r of EPA_RN)if(inBox(lat,lon,r.b)){rnRisk=r.r;rnEst=r.v;break}
  let soilClass=null,perm=null,drain=null,bedrock=null;
  for(const s of TEAGASC)if(inBox(lat,lon,s.b)){soilClass=s.cl;perm=s.perm;drain=s.dr;bedrock=s.br;break}
  let bestD=1e9,bestF=null;
  for(const f of FAULTS){const d=distFault(lat,lon,f);if(d<bestD){bestD=d;bestF=f}}
  return{lith,lithDesc,lithAge,K,U,Th,mag,rnRisk,rnEst,soilClass,perm,drain,bedrock,
    faultName:bestF?bestF.n:null,faultType:bestF?bestF.t:null,faultDist:bestD,
    tellusAvail:U!=null,epaRnAvail:rnEst!=null};
}


// ═════════════════════════════════════════════════════════════════════════════
// UI RENDERING
// ═════════════════════════════════════════════════════════════════════════════

const RC={GREEN:"#22c55e",AMBER:"#f59e0b",RED:"#ef4444"};
const RB={GREEN:"rgba(34,197,94,0.15)",AMBER:"rgba(245,158,11,0.15)",RED:"rgba(239,68,68,0.15)"};

function triPath(r,t,g){
  const mx=Math.max(r,t,g,0.5),s=50/mx;
  return`M 0 ${-r*s} L ${-t*s*0.87} ${t*s*0.5} L ${g*s*0.87} ${g*s*0.5} Z`;
}

function renderTriangle(fp,px){
  const tri=document.getElementById("triangle");
  if(!fp||!px){tri.style.display="none";return}
  const a=fp.arms,t=fp.risk.tier,c=RC[t]||"#22c55e";
  const mx=Math.max(a.radon,a.thoron,a.gamma,0.5),s=50/mx;
  tri.style.display="block";tri.style.left=px.x+"px";tri.style.top=px.y+"px";
  tri.innerHTML=`<svg width="160" height="160" viewBox="-80 -80 160 160" style="overflow:visible">
    <path d="${triPath(a.radon,a.thoron,a.gamma)}" fill="${RB[t]}" stroke="none" style="filter:blur(6px)"/>
    <path d="${triPath(a.radon,a.thoron,a.gamma)}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round"/>
    <line x1="0" y1="0" x2="0" y2="${-a.radon*s}" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="${-a.thoron*s*0.87}" y2="${a.thoron*s*0.5}" stroke="#f97316" stroke-width="3" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="${a.gamma*s*0.87}" y2="${a.gamma*s*0.5}" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="3" fill="${c}"/>
    <text x="0" y="${-a.radon*s-6}" text-anchor="middle" fill="#3b82f6" font-size="9" font-weight="bold">Rn</text>
    <text x="${-a.thoron*s*0.87-8}" y="${a.thoron*s*0.5+10}" text-anchor="end" fill="#f97316" font-size="9" font-weight="bold">Tn</text>
    <text x="${a.gamma*s*0.87+8}" y="${a.gamma*s*0.5+10}" text-anchor="start" fill="#22c55e" font-size="9" font-weight="bold">γ</text>
  </svg>
  <div class="triangle-tooltip" style="border-color:${c}">
    <div class="triangle-total" style="color:${c}">${fp.total.toFixed(2)} mSv/yr</div>
    <div class="triangle-tier" style="background:${c}">${t}</div>
  </div>`;
}

function renderPanel(fp,name){
  const pane=document.getElementById("panelPane"),content=document.getElementById("panelContent");
  if(!fp)return;
  const a=fp.arms,t=fp.risk.tier,c=RC[t];
  const mx=Math.max(a.radon,a.thoron,a.gamma);
  const bars=[
    {l:"Radon",v:a.radon,c:"#3b82f6",p:mx>0?(a.radon/mx)*100:0},
    {l:"Thoron",v:a.thoron,c:"#f97316",p:mx>0?(a.thoron/mx)*100:0},
    {l:"Gamma",v:a.gamma,c:"#22c55e",p:mx>0?(a.gamma/mx)*100:0},
  ].sort((x,y)=>y.v-x.v);

  // Short report lines
  const dom=a.radon>=a.thoron&&a.radon>=a.gamma?"radon":a.thoron>=a.gamma?"thoron":"gamma";
  const share=a[dom]/fp.total*100;
  const reportLines=[
    `${dom.charAt(0).toUpperCase()+dom.slice(1)} is ${share.toFixed(0)}% of total dose (${a[dom].toFixed(2)} mSv/yr).`,
    `Total terrestrial dose: ${fp.total.toFixed(2)} mSv/yr — ${t}.`,
    `Lithology: ${fp.lith} (${fp.lithName}). Ra=${fp.activities.Ra.toFixed(0)}, Th=${fp.activities.Th.toFixed(0)}, K=${fp.activities.K.toFixed(0)} Bq/kg.`,
    `Indoor radon: ${fp.C_Rn.toFixed(0)} Bq/m³ ${fp.C_Rn>=200?'⚠ EXCEEDS Irish 200 Bq/m³ action level':''}.`,
    `${(fp.total/2.2).toFixed(1)}× UNSCEAR world average (2.2 mSv/yr).`,
    `Confidence: ${fp.conf>=75?'high':fp.conf>=50?'medium-high':'medium'} — ${fp.prov.join(', ')}.`,
    `Ra-eq: ${fp.raeq.toFixed(0)} Bq/kg ${fp.raeq>=370?'⚠ exceeds 370 threshold':''}.`,
    `Cell: 100m. GSI Bedrock 1:100k ${fp.prov.some(p=>p.includes('measured'))?'(Tellus override)':''}.`,
  ];

  content.innerHTML=`<div class="panel">
    <div class="panel-header"><div>
      <h2 class="panel-title">${name||'Analysis'}</h2>
      <div class="panel-subtitle">${fp.prov.some(p=>p.includes('measured'))?'Measurement-grade':'Lithology-prior estimate'} · Irish Terrestrial Dose</div>
    </div></div>
    <div class="risk-badge" style="border-color:${c}40;background:${c}10">
      <span class="risk-tier" style="background:${c}">${t}</span>
      <span class="risk-total" style="color:${c}">${fp.total.toFixed(2)} mSv/yr</span>
      <span class="risk-vs">${fp.total>2.2?(fp.total/2.2).toFixed(1)+'× UNSCEAR avg':'≤ UNSCEAR avg'}</span>
    </div>
    <div class="triangle-section"><svg width="200" height="200" viewBox="-100 -100 200 200">
      <path d="${triPath(a.radon,a.thoron,a.gamma)}" fill="${RB[t]}" stroke="none"/>
      <path d="${triPath(a.radon,a.thoron,a.gamma)}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linejoin="round"/>
      <line x1="0" y1="0" x2="0" y2="${-a.radon*(100/Math.max(a.radon,a.thoron,a.gamma,0.5))}" stroke="#3b82f6" stroke-width="4" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="${-a.thoron*(100/Math.max(a.radon,a.thoron,a.gamma,0.5))*0.87}" y2="${a.thoron*(100/Math.max(a.radon,a.thoron,a.gamma,0.5))*0.5}" stroke="#f97316" stroke-width="4" stroke-linecap="round"/>
      <line x1="0" y1="0" x2="${a.gamma*(100/Math.max(a.radon,a.thoron,a.gamma,0.5))*0.87}" y2="${a.gamma*(100/Math.max(a.radon,a.thoron,a.gamma,0.5))*0.5}" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>
      <circle cx="0" cy="0" r="4" fill="${c}"/>
      <text x="0" y="${-a.radon*(100/Math.max(a.radon,a.thoron,a.gamma,0.5))-8}" text-anchor="middle" fill="#3b82f6" font-size="11" font-weight="700">Rn ${a.radon.toFixed(2)}</text>
      <text x="${-a.thoron*(100/Math.max(a.radon,a.thoron,a.gamma,0.5))*0.87-10}" y="${a.thoron*(100/Math.max(a.radon,a.thoron,a.gamma,0.5))*0.5+14}" text-anchor="end" fill="#f97316" font-size="10" font-weight="600">Tn ${a.thoron.toFixed(2)}</text>
      <text x="${a.gamma*(100/Math.max(a.radon,a.thoron,a.gamma,0.5))*0.87+10}" y="${a.gamma*(100/Math.max(a.radon,a.thoron,a.gamma,0.5))*0.5+14}" text-anchor="start" fill="#22c55e" font-size="10" font-weight="600">γ ${a.gamma.toFixed(2)}</text>
    </svg></div>
    <div class="dose-bars">${bars.map(b=>`
      <div class="dose-bar-row">
        <span class="dose-bar-label">${b.l}</span>
        <div class="dose-bar-track"><div class="dose-bar-fill" style="width:${b.p}%;background:${b.c}"></div></div>
        <span class="dose-bar-value" style="color:${b.c}">${b.v.toFixed(2)}</span>
      </div>`).join('')}</div>
    <div class="section">
      <h3 class="section-title">Report</h3>
      ${reportLines.map(l=>`<div class="report-line">${l}</div>`).join('')}
    </div>
    <div class="section">
      <h3 class="section-title">Factors</h3>
      <table class="factors-table"><tr><th>Factor</th><th>Value</th><th>Effect</th></tr>
        <tr><td>Lithology</td><td>${fp.lith} (${fp.lithName})</td><td class="dir-neutral">Rn Tn γ source</td></tr>
        <tr><td>Activities</td><td>Ra=${fp.activities.Ra.toFixed(0)} Th=${fp.activities.Th.toFixed(0)} K=${fp.activities.K.toFixed(0)}</td><td class="dir-neutral">source term</td></tr>
        <tr><td>Indoor Rn</td><td>${fp.C_Rn.toFixed(0)} Bq/m³</td><td class="${fp.C_Rn>=200?'dir-up':fp.C_Rn>=100?'dir-up':'dir-neutral'}">${fp.C_Rn>=200?'↑ above Irish action':fp.C_Rn>=100?'↑ elevated':'→ normal'}</td></tr>
        <tr><td>Ra-eq</td><td>${fp.raeq.toFixed(0)} Bq/kg</td><td class="${fp.raeq>=370?'dir-up':'dir-neutral'}">${fp.raeq>=370?'↑ above 370':'→ within limits'}</td></tr>
      </table>
    </div>
    <div class="section">
      <h3 class="section-title">Confidence</h3>
      <div class="confidence-meter">
        <div class="confidence-track"><div class="confidence-fill" style="width:${fp.conf}%;background:${fp.conf>=75?'#22c55e':fp.conf>=50?'#f59e0b':'#ef4444'}"></div></div>
        <div class="confidence-labels"><span>Low</span><span class="confidence-score" style="color:${fp.conf>=75?'#22c55e':fp.conf>=50?'#f59e0b':'#ef4444'}">${fp.conf}%</span><span>High</span></div>
      </div>
      <p class="confidence-note">${fp.conf>=75?'Direct measurement data available (Tellus airborne radiometric).':fp.conf>=50?'Partial measurement data.':'Geology-prior estimate only — no measurement data nearby.'}</p>
    </div>
    <div class="section">
      <h3 class="section-title">Provenance</h3>
      <div class="provenance">${fp.prov.map(p=>`<div class="provenance-item">${p}</div>`).join('')}</div>
    </div>
    <div class="section" style="border-bottom:none">
      <div class="std-row"><span class="std-dot green"></span><span>GREEN: ≤ 2.2 mSv/yr (≤ world avg)</span></div>
      <div class="std-row"><span class="std-dot amber"></span><span>AMBER: 2.2–6.6 mSv/yr (1–3× avg)</span></div>
      <div class="std-row"><span class="std-dot red"></span><span>RED: > 6.6 mSv/yr or Rn ≥ ${IRISH_RN_ACTION} Bq/m³</span></div>
      <div class="std-row" style="margin-top:6px;font-size:10px;opacity:0.6">Irish action level: ${IRISH_RN_ACTION} Bq/m³ (stricter than EU 300) · EU BSS 2013/59/Euratom</div>
    </div>
  </div>`;
}


// ═════════════════════════════════════════════════════════════════════════════
// MAP INITIALIZATION
// ═════════════════════════════════════════════════════════════════════════════

const map=new maplibregl.Map({
  container:"map",
  center:[-8.5,53.3],zoom:7,maxZoom:18,minZoom:5,
  maxBounds:[[-10.7,51.3],[-5.2,55.5]],
  style:{version:8,sources:{
    "esri-imagery":{type:"raster",tiles:["https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"],tileSize:256,attribution:"© Esri"},
    "esri-labels":{type:"raster",tiles:["https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}"],tileSize:256,attribution:"© Esri"},
  },layers:[
    {id:"satellite",type:"raster",source:"esri-imagery",minzoom:0,maxzoom:18},
    {id:"labels",type:"raster",source:"esri-labels",minzoom:0,maxzoom:18},
  ]},
});

map.addControl(new maplibregl.ScaleControl({maxWidth:100}),"bottom-left");
map.addControl(new maplibregl.NavigationControl(),"top-right");

let hoverData=null,hoverPixel=null,pinnedData=null,pinnedName="";
let debounceTimer=null;

function updateBadges(fp){
  const tb=document.getElementById("badgeTellus"),eb=document.getElementById("badgeEpa");
  if(fp&&fp.prov.some(p=>p.includes("measured"))){tb.className="data-badge";tb.textContent="✓ Tellus"}
  else{tb.className="data-badge inactive";tb.textContent="Tellus"}
  if(fp&&fp.C_Rn>0){eb.className="data-badge";eb.textContent="✓ EPA Rn"}
  else{eb.className="data-badge inactive";eb.textContent="EPA Rn"}
}

map.on("mousemove",e=>{
  const{lng,lat}=e.lngLat;
  if(lat<51.4||lat>55.4||lng<-10.6||lng>-5.3){
    hoverData=null;renderTriangle(null,null);
    document.getElementById("statusCoords").textContent="Outside Ireland";
    return;
  }
  clearTimeout(debounceTimer);
  debounceTimer=setTimeout(()=>{
    const raw=sampleAt(lat,lng);
    if(!raw)return;
    const fp=doseFingerprint({
      lithology:raw.lith,eU_ppm:raw.U,eTh_ppm:raw.Th,K_pct:raw.K,C_Rn:raw.rnEst,
      permeability:raw.perm,dist_fault:raw.faultDist,
    });
    hoverData=fp;hoverPixel=e.point;
    renderTriangle(fp,e.point);
    updateBadges(fp);
    document.getElementById("statusCoords").textContent=`${lat.toFixed(4)}°N, ${lng.toFixed(4)}°W — ${raw.lithDesc}`;
  },100);
});

map.on("click",e=>{
  const{lng,lat}=e.lngLat;
  if(lat<51.4||lat>55.4||lng<-10.6||lng>-5.3)return;
  const raw=sampleAt(lat,lng);
  if(!raw)return;
  const fp=doseFingerprint({
    lithology:raw.lith,eU_ppm:raw.U,eTh_ppm:raw.Th,K_pct:raw.K,C_Rn:raw.rnEst,
    permeability:raw.perm,dist_fault:raw.faultDist,
  });
  pinnedData=fp;pinnedName=raw.lithDesc;
  renderPanel(fp,raw.lithDesc);
  updateBadges(fp);
});

document.getElementById("presetSelect").addEventListener("change",e=>{
  const val=e.target.value;if(!val)return;
  const[lat,lon]=val.split(",").map(Number);
  map.flyTo({center:[lon,lat],zoom:14,essential:true});
  const raw=sampleAt(lat,lon);if(!raw)return;
  const fp=doseFingerprint({
    lithology:raw.lith,eU_ppm:raw.U,eTh_ppm:raw.Th,K_pct:raw.K,C_Rn:raw.rnEst,
    permeability:raw.perm,dist_fault:raw.faultDist,
  });
  pinnedData=fp;pinnedName=raw.lithDesc;
  renderPanel(fp,raw.lithDesc);
  updateBadges(fp);
});

document.getElementById("searchBtn").addEventListener("click",async()=>{
  const q=document.getElementById("searchInput").value.trim();if(!q)return;
  try{
    const resp=await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q+", Ireland")}&limit=1`);
    const data=await resp.json();
    if(data?.[0]){
      const lat=parseFloat(data[0].lat),lon=parseFloat(data[0].lon);
      if(lat>=51.4&&lat<=55.4&&lon>=-10.6&&lon<=-5.3){
        map.flyTo({center:[lon,lat],zoom:14,essential:true});
        const raw=sampleAt(lat,lon);if(!raw)return;
        const fp=doseFingerprint({
          lithology:raw.lith,eU_ppm:raw.U,eTh_ppm:raw.Th,K_pct:raw.K,C_Rn:raw.rnEst,
          permeability:raw.perm,dist_fault:raw.faultDist,
        });
        pinnedData=fp;pinnedName=raw.lithDesc;
        renderPanel(fp,raw.lithDesc);
        updateBadges(fp);
      }else{alert("Location outside Ireland.")}
    }
  }catch(err){console.error("Search failed:",err)}
});

document.getElementById("searchInput").addEventListener("keydown",e=>{
  if(e.key==="Enter")document.getElementById("searchBtn").click();
});
</script>
</body>
